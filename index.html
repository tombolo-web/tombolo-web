    { id:"mix-94", title:"TOMBOLOMIXX 94", artist:"Bull Horris", date:"2023", duration:"1:07:27", genre:"", cover:"https://i1.sndcdn.com/artworks-DtpDJezP7CxYWUch-JyC1Dg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-094-bull-horris", notes:"Introducing Bull Horris, a beautiful babe that comes from Dublin <3\nCo-founder of Tender collective, he has been making noise lately, from playing at staple of queer nightlife Adonis, to residencies at Dublin’s Strawberries.\n\nAmazing mix, the perfect energy your body needs when you start the weekend. Vibrant rythms, sexy vocals over house melodies that evolutes into speedy trance baselines.\n\nTie your laces, let's gooooo :)\n@user-586040792" },
    { id:"mix-93", title:"TOMBOLOMIXX 93", artist:"hessIless", date:"2023", duration:"1:20:26", genre:"downtempo", cover:"https://i1.sndcdn.com/artworks-NIWhbGGwFPlpLeE7-G8HQmw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-093-hesiless", notes:"Straight from Yerevan's heart, Grigori Poghosian, known as @hessIless_gal, burst onto the scene in 2020, at Poligraf and quickly became a regular fixture. His sets are nothing short of a musical odyssey, spanning slow and fast-paced house, electro, techno, breaks, jungle, and everything in between. \n\nGrigori's unmatched skills behind the decks are a testament to the time he's dedicated to exploring the nuances of electronic music. But for him, it's not just about the technicalities. His key responsability is to create a harmonious journey for both body and soul, taking audiences on a transformative musical experience." },
    { id:"mix-92", title:"TOMBOLOMIXX 92", artist:"Senda Fatal", date:"2023", duration:"1:06:18", genre:"energia astral", cover:"https://i1.sndcdn.com/artworks-gfRVQtPKSrF4XrKH-UJmQIw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolo-senda-fatalmp3", notes:"Supreme stuff by my beloved @SendaFatal aka Rodri. Here is somebody that has never stopped working to push the music scene in Madrid and more. A music jounalist, festival organizer and great dj; again... all heart\n\nThis mix is pure energy. Over 1h of dance music, house and acid tunes that will make your weekend." },
    { id:"mix-91", title:"TOMBOLOMIXX 91", artist:"Mola Mola", date:"2023", duration:"1:15:32", genre:"Industrial", cover:"https://i1.sndcdn.com/artworks-v7mB35J5u13MdHNv-sv5CJA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-091-mola-mola", notes:"@molamolafassade is a london based german dj and promoter, founder of fassade series. \n\nHe is a key contributor for the Ruhr Areas subculture since years. With his constantly developing sound vision, he has been heavily touring around throwing highway techno jams wherever he goes.\n\nTracklist****\nal wooton, azu tiwaline - nine points\natomic moog - static flow\nm.r.e.u.x - green fax\nmtrl - taris (mary yuzowskaya rmx)\ntelikan - parallel\nblanka - current vibrations\npolar inertia - paralell transport\nmathys lenne - sense\natomic moog - chasing blue\nrene wise - changa\nleafar legov - melting\nmartinou - thunder road\nclaudio prc - haidou\naltinbas- adda\nbiri - clarity\nmartinou - rose sufix\nisabel soto - akasha\nprimal code - white river\nbensen, naty seres - interplanetary dust clouds\nsterac - satyricon\ndeveloper - time and time again\nsubradeon - magdala" },
    { id:"mix-90", title:"TOMBOLOMIXX 90", artist:"Nahoomie", date:"2023", duration:"1:02:04", genre:"House", cover:"https://i1.sndcdn.com/artworks-jxx7YgoiEt5JGZBj-xfduxA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-090-nahoomie", notes:"Wooohoooo!\n\nIt's time for @Nahoomie! Pure energy and selection that translates into brightness on the dance floor. This is how this upcoming artist has quickly carved a niche for himself in the local spanish underground scene. Her link with electronic music, digging and the so-called 'dance culture' began at the end of her adolescence, many years before his first contact with the decks. However, little by little she discovered and experimented with different genres, rhythms and sounds that helped her to cement and establish her own artistic identity.\n\nAlthough her roots are pure USA house, she has a weakness for polyrhythmic sounds. Her sets are dance rituals full of eclecticism that include powerful bases and hit hats, in which he embraces and fuses different registers ranging from UK garage, or all kinds of house to breakbeat, electro or IDM.\n\nCatch her on the 31st of March at Tombolo Club amongst other artists such as Pascale Project and OG Juan!" },
    { id:"mix-89", title:"TOMBOLOMIXX 89", artist:"Vandàla", date:"2023", duration:"1:04:29", genre:"", cover:"https://i1.sndcdn.com/artworks-lQuQc9bu0PgR2nEq-UAXKig-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomix-089-vicky-vandala", notes:"Yay! Vandàla (@vickyvandala) is a cruise with stops all along the body; head, shoulders, knees and toes.\n\nInspired by the Brazilian and UK electronic music scene, her sessions feature fast beats, sizzling vocals, slick percussions and chubby drums.\n\nIn the last year she has played in different venues and promoters such as Boiler Room, El Row, Razzmatazz, DabaDaba, Siroco or Serendipia and collaborated with labels and collectives like Noise Pollution, Vimana, Suave Club o Dembooty.\n\nThis mix is fire. Nothing else to say." },
    { id:"mix-88", title:"TOMBOLOMIXX 88", artist:"Mou", date:"2023", duration:"1:02:13", genre:"", cover:"https://i1.sndcdn.com/artworks-oqZXXWlvErFoFzBR-XoPdJA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-090-mou", notes:"Sergio Outeiriño (@mounderg) is a dj from Ourense, Galicia (north of Spain) better known as Mou. He's been spinning records for over a decade in serious parties around the country. He launched his own label in 2018  Must Be On Wax (@mbowtrax) with releases from great artists from his community.\n\nThis mix is absolute madness, dub, house, breaks, all kinds of trancy melodies, acid rythms and crazy percussions for over 1h. Enjoy!" },
    { id:"mix-87", title:"TOMBOLOMIXX 87", artist:"Lora Mipsum", date:"2023", duration:"1:12:39", genre:"", cover:"https://i1.sndcdn.com/artworks-YTKoGKqKERuA1BYj-1dbEag-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/loramipsumtombolo", notes:"Big up for Katie, aka @loramipsum, a really exciting London based selector, that alongside with ANNX (@anna-rose-wirth) she runs the non profit party - WHOMP where she kills it in a regular basis. She plays a very intense sound, mix of breaks, techno full of acid glimpses, that is taking her to play in festivals as Dimensions 2023. Check her outtt!" },
    { id:"mix-86", title:"TOMBOLOMIXX 86", artist:"Flü", date:"2022", duration:"59:53", genre:"", cover:"https://i1.sndcdn.com/artworks-6UlclUu1UmcBzhAz-zvzQAw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/flu-mix", notes:"Introducing Flü! Based in Istambul he's been working as a dj and music curator in some the most well-known venues of the city since he was very young. As a resident at Root Radio he is definitely one of Turkey's top class djs." },
    { id:"mix-85", title:"TOMBOLOMIXX 85", artist:"Rachael", date:"2022", duration:"1:11:23", genre:"", cover:"https://i1.sndcdn.com/artworks-ug5NwmC4EXOkhQeO-1AQPog-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx085-rachael", notes:"ARRRGGGG\n\nOur 85th mix of the serie comes from a very special guest to us. \n\nSo proud to have Rachael (@raquel-vi) amongst our series. An incredibly talented upcoming dj based in Madrid with a very particular style when it comes to spin records. Keeping it misterious on her own way, you could be lucky to catch her playing in some parties in the city. \n\nThis mix is a true trip. For real. Techno over breaks over uk garage banger after banger all in vinyl format. Enjoy." },
    { id:"mix-84", title:"TOMBOLOMIXX 84", artist:"Gary", date:"2022", duration:"58:56", genre:"ENERGY", cover:"https://i1.sndcdn.com/artworks-Fx7FnmnBOW9zfNIF-Xle8JQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-084-gary", notes:"Beautiful, fun and hectic mix of young dj @gary2d2f coming str8 from Dublin, Ireland. Bomb after bomb after bomb after bomb....\n\n@tendertendxr" },
    { id:"mix-83", title:"TOMBOLOMIXX 83", artist:"Hame DJ", date:"2022", duration:"1:24:20", genre:"Downtempo", cover:"https://i1.sndcdn.com/artworks-6BYPrxq22bvPd57s-EdVyDw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/love-letter-2-myself-hame-dj", notes:"@Hame_DJ is an artist from Perth, Australia. A producer and dj that has been able to release in some of my favorite labels like @RadiantRecords or @KalaharyOysterCult, in coop with big artists such as Roza Terenzi. He has a particular style that surfs a trance wave, over strong beats and heavy baselines.\n\nThis mix is a trip to the very bottom of earth. Slow downtempo rythms that will slowly wake up your body and take you into an enjoyable journey." },
    { id:"mix-82", title:"TOMBOLOMIXX 82", artist:"Bennet", date:"2022", duration:"1:07:46", genre:"HEAT", cover:"https://i1.sndcdn.com/artworks-rtN3lrTXfw1FO7tR-SkmPwQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-082-bennet", notes:"Ayy ayy ayyyeee :3\n\n@Bennet_bb is a wonderful artist based in Hanover, Germany. He comes with an amazing selection of house, acid and breaks old school bangers that makes you wanna take out your shirt and dance even at home.\n\n Bennet is part of the DJ-collective Soft Spot which was founded by women & LGBTIQA+ in Hanover to open up spaces for experimental electronic sounds on the dance floor. This mix is so much fun man, amazing energy tune after tune. Enjoy!!\n\nParis is burning baby <3" },
    { id:"mix-81", title:"TOMBOLOMIXX 81", artist:"Orion Agassi", date:"2022", duration:"54:42", genre:"", cover:"https://i1.sndcdn.com/artworks-Kz4CjToRj4FM4cVM-Ei4SnA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-079-orion-agassi", notes:"@OrionAgassi is a producer and dj based in Asturias, Spain. He is always on shape, trying to bring the freshest sound to the table. He manages @RitmoAstral, a label focused on \"Hot Jams Straight Out The 330XX\" as he describes it (there's actually no better way). Different EPs and edits compilated from him and his friends, with sticky rythms and latin vocals.\n\nThis mix is all about sweaty music, dirty lyrics over strong baselines and funny rollercoaster pianos, perfect to get your booty shaking on the dancefloor.\n\n#desacatao" },
    { id:"mix-80", title:"TOMBOLOMIXX 80", artist:"Daisy Moon", date:"2022", duration:"1:02:43", genre:"", cover:"https://i1.sndcdn.com/artworks-jHGGkjyW7RDl5Qdx-19bHPA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-080-daisy-moon", notes:"Yayyy!!! \n\n@DaisyMoon is a DJ and promoter from Bristol. She started her way in the city through the Housework party series she hosted alongside Shanti Celeste, Golesworthy and Gramrcy. Fast becoming a local legend, Daisy has since picked up a radio residency on @NoodsRadio, released on @IdleHands and Curl Recordings and is also co-runs Mix Nights - a non-project initiative working with women, non-binary and general minorities in Bristol. She is also the curator of Off-Kilter, which is her most recent venture and manifests as a mix series and live/DJ events platform that nods to the experimental, murkier side of her tastes.\n\nShe is playing next at Tombolo Club in Madrid on saturday 10th of September alon @reptant_the_lizard, @ogjuan1 and @laind0 so do absolutely not miss her!\n\n@daisymoon" },
    { id:"mix-79", title:"TOMBOLOMIXX 79", artist:"Noise Diva", date:"2022", duration:"37:20", genre:"", cover:"https://i1.sndcdn.com/artworks-G7l92weB6B5EdjOM-lkjNzg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/079-noise-diva", notes:"Big up fo Yara Said aka Noise Diva!\n\nStraight from Amsterdam, Yara is a noise explorer and sonic chaos curator. Close your eyes, tie your shoes and prepare yourself for an amazing trip. From ambient to trap, from UKG to noise, she approaches music from an emotional and performative point. This mix is all you need to warm up for the weekend.\n\n@yara-said-4" },
    { id:"mix-78", title:"TOMBOLOMIXX 78", artist:"Phran", date:"2022", duration:"1:00:12", genre:"", cover:"https://i1.sndcdn.com/artworks-iT5kWyzHFnQfTQil-Q7SXTQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/phrantombolomix", notes:"Venezuelan born producer Fran Meija aka @phran has been active in the Barcelona electronic underground scene through several projects for many years now. Always on shape, and to name a few of his creations check the house and analogue jams of \"@peopleyoumayknowpumk\" - an improvisational duo formed with @Ylia, or \"Dos Ritmos\" - a latin tinged project with @LucaLozano (@Klassewrecks) that seeks the symbiosis of ancestral beats and electronics. \n\nOn this mix you can find beautiful downtempo jams with acid baselines, psychedelic vocals and delightful piano melodies.  So excited to have him on the podcast :3\n\n- Dos Ritmos - Materia\n- MMMMMMM - Samo DJ & Pedrodollar Remix\n- Cheating Track (Luginin Take 2)\n- Forgemasters - Metallic\n- CP Smith - Don’t Stop\n- Pelada - no hay\n- Phran - turno\n- Mueran Humanos - Cuando una persona común se eleva (Alessandro adrianni remix)\n- ????\n- Phran - Amphibia\n- DJ Bert - Sencillo\n- Ambient Baby - Engendrx\n- Phran - Transformen" },
    { id:"mix-77", title:"TOMBOLOMIXX 77", artist:"Süheyla", date:"2022", duration:"1:00:13", genre:"", cover:"https://i1.sndcdn.com/artworks-WxcKv1IAjtyUy37G-iMeApw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/future-planet", notes:"Süheyla (@suheyladotwav) is an upcoming artist from Istambul, Turkey. She combines an amazing variety of genres where you can find electro melodies with broken beats amongst tribal motifs, or acid baselines. Watch her close as you might see her soon in your local club or festival.  Peace!\n\n**TL**\n1- Neoser - Relax (2022)\n2- Guy Contact - Desert Portal (2022)\n3- Emissive - Constellation of Friends (2022)\n4- Sedef Adasi - Baby Snakes (2022)\n5- Tifra - Plastic Replicant (2022)\n6- Dj Steve - Vandal Eyes (Luca Lozano remix) (2021)\n7- Nate S.U - Super Puma (2022)\n8- B.Love - Magnum (2022)\n9- Paramida - Konbanwa (Ibiza Mix) (2022)\n10- Man/ipulate - Eternity (Alex Kassian\\'s Ode To Sunshine Mix) (2022)\n11- Fader Cap - The Journey (3am Extended Mix) (2022)\n12- Bobby. - Source Material (2022)\n13- Sepehr - Night Is Young (2020)\n14- Tapestry Of Sound - Wasp Of A Woman (2021)\n15- Ara U / Radioactive Man - Failure To Communicate (2020)\n16- Sound Synthesis - Electro Planet (2022)" },
    { id:"mix-76", title:"TOMBOLOMIXX 76", artist:"Philip Budny", date:"2022", duration:"1:00:16", genre:"House", cover:"https://i1.sndcdn.com/artworks-3TFJonPuBLBuROyH-6azrKw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomix076-philip-budny", notes:"Hey hey!!!\n\nHappy to host Berlin-based dj & producer, Philip Budny. With a handful of beautiful EPs to his name on @Coastal-Haze, @LionoilIndustries and Let’s Play House (@lphnyc), @PhilipBudny specialises in lazy, sun-kissed house music.  \n\nNow that we are in plain summer this is the music we need, perfect for a sunny party at a terrace, enjoying a cocktail in the swimming pool. \n\nsLuRrRrRpPppPP!" },
    { id:"mix-75", title:"TOMBOLOMIXX 75", artist:"Minish", date:"2022", duration:"1:09:29", genre:"House", cover:"https://i1.sndcdn.com/artworks-6RiWqbKGBYRM1ZCK-LhBH6Q-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-075-minish", notes:"Fun mix from minish (@minishseoul). He's a house DJ based in Seoul, South Korea. The definition of Elegance when playing. Total party music, fun beats over creamy melodies, and acid waves, but especially prefers the unique rough sound of the 90s. He gets the inspiration from from Seoul's nights, where every day is busy. Check out his mixes specially the ones for @seoulcommunityradio. Ultra good." },
    { id:"mix-74", title:"TOMBOLOMIXX 74", artist:"Willee", date:"2022", duration:"1:09:50", genre:"", cover:"https://i1.sndcdn.com/artworks-CLqXLRpjPNYG8wY2-IEfyyw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-074-willie-ortiz", notes:"Brilliant selection from Melbourne local Willee (@willeewillee): Just the perfect sound for ya afterparty :))" },
    { id:"mix-73", title:"TOMBOLOMIXX 73", artist:"Eder Croket", date:"2022", duration:"1:09:35", genre:"Breaks", cover:"https://i1.sndcdn.com/artworks-LU0izoBZiopnqAWB-XPxjdA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/eder-croket", notes:"Unstoppable, tireless, @EderCroket is one of a kind. A full dj, one of those who keeps the same passion as he used to more than 10 years ago when he started playing and organizing events. He runs @discotecagalactica, a promoter and mix series that has established one of the best parties in Madrid to the day. Although Eder is crazy about disco/italo, this mix is full of breaks, synths and crazy melodies that will get you through the day ***\n\nenjoyyy!" },
    { id:"mix-72", title:"TOMBOLOMIXX 72", artist:"Jerome", date:"2022", duration:"1:03:15", genre:"", cover:"https://i1.sndcdn.com/artworks-Pz4AWtjugCqSu4LU-d8EbZA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-072-jerome", notes:"Here's a very special one. No need of introduction. The one and only, record label and fellow mix series boss @jeromeworldwide." },
    { id:"mix-71", title:"TOMBOLOMIXX 71", artist:"Tanzabend", date:"2022", duration:"1:14:40", genre:"", cover:"https://i1.sndcdn.com/artworks-HWFvYxNpLYlGceTS-c3Q5fw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-071-tanzabend", notes:"My friend @tanzabend str8 from madrid's heart <3" },
    { id:"mix-70", title:"TOMBOLOMIXX 70", artist:"OG Juan (Live at Tombolo Club)", date:"2022", duration:"1:54:40", genre:"Energy", cover:"https://i1.sndcdn.com/artworks-hWYWCCeLmgJzolzz-Wjkz8w-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/og-juan-live-tombolo1", notes:"2h of high energy bangers by @ogjuan1 recorded on the last Tombolo Club on 05/03/2022 amongst other big players such as @djgigola and @nnad1a" },
    { id:"mix-69", title:"TOMBOLOMIXX 69", artist:"Ariel Sports", date:"2022", duration:"47:25", genre:"", cover:"https://i1.sndcdn.com/artworks-78g3EjuTrCYc6QLV-OF3CDA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-069-ariel-sports", notes:"Ariel Sports (@arielsports) is an artist and deejay from Detroit that explores concepts of trans embodiment, community engagement, and dancefloor activism through live mixing, sound collage, video installation and nightlife events. She co-ran a collective called Fem Farm with her sister PrismViews, which prioritized transwomen and queer DJs to experiment with sound and visuals. Her mix is a polyrhythmic journey of club constructions, and an ode to the global trans and queer community!" },
    { id:"mix-68", title:"TOMBOLOMIXX 68", artist:"Love Higher", date:"2022", duration:"47:46", genre:"", cover:"https://i1.sndcdn.com/artworks-SXQ3JVdWgWbZJbkP-y7uyew-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-068-love-higher", notes:"Based in Colombus, Ohio, introducing @Love_Higher is a dj and producer that co-runs @Verge-FM, an independent radio that promotes emerging and underground artists primarily from the Midwest and beyond. \n\nThis mix is an absolute bomb. Fresh breaks, house with late hip hop motives, perfect to aim for the weekend and sweat from the sofa." },
    { id:"mix-67", title:"TOMBOLOMIXX 67", artist:"Dileta", date:"2022", duration:"1:34:06", genre:"", cover:"https://i1.sndcdn.com/artworks-41XWNytZxa5x6YE1-wTfo2A-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-067-dileta", notes:"Introducing pasca aka Dileta (@diletamtl) straight from Montreal's heart. \n\nBig fan of her music selection and curation. First mix of the year and definitely one of the most intenses we had. She'll take you through lots of technoish tribal, industrial influences, and hidden breakbeat gems. \n\nEnjoy***" },
    { id:"mix-66", title:"TOMBOLOMIXX 66", artist:"Amelia Holt", date:"2021", duration:"1:47:01", genre:"", cover:"https://i1.sndcdn.com/artworks-ANE8kXXKsu84zSq8-ySJnmQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/ameliawav", notes:"Well well well... Another year has passed by! \n\nSo happy to end it up with a mix from this upcoming big artist from nyc. Mexican born, @AmeliaHolt is a resident at @publicrecordsnyc and a host at @movement-radio-athens. \n\nThis mix was recorded in the legendary Good Room last month, and definitely takes you on a trip to other dimensions. House, breaks, IDM and beautiful baselines that surf trancy synths. Could imagine how sweaty that dancefloor should have been, so much rythm man..." },
    { id:"mix-65", title:"TOMBOLOMIXX 65", artist:"I-94", date:"2021", duration:"1:18:53", genre:"Jazz", cover:"https://i1.sndcdn.com/artworks-BiQcOZCj7UAO5JVm-zQEQGQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-065-i-94", notes:"Myyyy man I-94 (@interstatenuevecuatro)straight from Madrid's heart putting out some beautiful jams. Jazz, disco, salsa, hip hop hmmmm, a full masterclass of one of the best selectors of the city. Check out his collective @downwallcollective for more music and events. YAMMMM" },
    { id:"mix-64", title:"TOMBOLOMIXX 64", artist:"Unknown Mobile", date:"2021", duration:"1:00:00", genre:"", cover:"https://i1.sndcdn.com/artworks-2p6Dyvs2mMvwxyCk-zIT04w-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-064-unknown-mobile", notes:"Ay ay ayy ***\n\nIntroducing Levi aka @Unknown-Mobile. You'll know him well from his well received releases across some of the dance sphere and Canada's finest; @PlanetEuphorique, @PacificRhythm, @SOBOsobo & ASL Singles Club among otherss.\n\nHis production style is something tricky to nail down, but It's safe to say though that his work always manages to hit a certain spot, whilst transcending fads and phases along the way. This mix certainly kicks it, as he goes from house to breaks to phonk to everrrything. \n\n\nunknownmobile.bandcamp.com" },
    { id:"mix-63", title:"TOMBOLOMIXX 63", artist:"Pau Roca", date:"2021", duration:"59:10", genre:"House", cover:"https://i1.sndcdn.com/artworks-7PQ5vUxQTnkOD0eI-N2ZInA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-063-pau-roca", notes:"Yes yes yesss!\n\nVery happy to have this one in the collection. Pau Roca (@paur) has built himself a reputation for being one of the absolute \"house master\" of Barcelona, as described in a review of the festival Sónar.\n\nHe's been definitely one of the most active players in the city with many projects on the go. He runs a bi-monthly residency at Nitsa Club (@nitsa-club) where he supports artists and proposals close to his musical tastes, hosting top acts such as Jovonn, DJ Bone, Dan Shake or Rick Wilhite. Couple of years ago, in 2013 he decided to venture into the record business by founding the label Bons Records (@bons-records) in 2013 with his partner Gon and Escola Records (@escola_records) with legend Breixo Martinez. \n\nThis mix is full of sunny house tracks, a one hour taste of his music selection. Seat back and enjoyyyy**\n\nTL\nMore or Less - Phantom Slasher\nHLSS - Champion Sound\nToxic Two - Rave Generator\nGlenn Underground - CVO Reprise\nNature Boy - 9 Ether (unreleased)\nSunscreem - Pressure (fire island mix)\nDj Tonka - Getting Ready\nNeal Howard - Indulge (club house)\nQuest - Mind Games (jamie326 edit)\nNightMoves - NightMoves (dub)\nDenise M - Don’t runaway (club mix)\nLooney Tunes - Just as long as…\nJolly Roger - Acid Man (happy mix)\nLa Rok & Horizon - Tribal Feeling\nClaude Young - You Give Me (dub)\nBrersoul - What Is Your Sign\nHigher Level - Til the break of dawn" },
    { id:"mix-62", title:"TOMBOLOMIXX 62", artist:"DJ Lentil", date:"2021", duration:"59:14", genre:"Techno", cover:"https://i1.sndcdn.com/artworks-y23Wg0uBa9T6C4z8-gpX98g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-062-dj-lentil", notes:"Yeeeehewww!\n\nBerlin based, Belarus raised, young @dj_lentil takes us on a fun journey, full of speedy bangers, techno anthems, and rave rythm$$\n\nenjoyyyy!" },
    { id:"mix-61", title:"TOMBOLOMIXX 61", artist:"DJ Joserra aka La Ind0", date:"2021", duration:"1:16:23", genre:"Jungle", cover:"https://i1.sndcdn.com/artworks-ERdfVrRJr5dEKneC-Q5Cu1A-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-dj-joserra", notes:"My dear friend, and Madrid's local hero La Ind0 (@ind0e) presents his new aka DJ JOSERRA for the first time. Pure madness, a full hour of breakz, techno, UK garage and jungle flavours. He played for us a few months ago in TOMBOLO TV, where he delivered a beautiful vinyl only set making the small crowd of the studio get nuts wiz it. Tie up your laces and get ready to jump." },
    { id:"mix-60", title:"TOMBOLOMIXX 60", artist:"Fernanda Arrau", date:"2021", duration:"1:05:33", genre:"House", cover:"https://i1.sndcdn.com/artworks-LKf1YXyP9KOCSMEF-sTy2lA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-060-fernanda-arrau", notes:"Yeeeeheheewww!!\n\nSuch a pleasure to have @Fernanda-Arrau with us. This super chilean DJ and produce has been one of the main and most recognisable links Santiago's party circuit and the city's electronic music scene for more than 15 years. \n\nShe likes to observe how people react on the dancefloor to her tracks. Disco, dark, funky and intense rhythms. This mix is just as fun as it can get.\n\nenjoyy**" },
    { id:"mix-59", title:"TOMBOLOMIXX 59", artist:"Fear-E", date:"2021", duration:"1:05:25", genre:"Techno", cover:"https://i1.sndcdn.com/artworks-eSjxpCyLc1djPlyD-zoi5mw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/mixx-058-fear-e", notes:"Introducirng Glasgow-based producer and dj @Fear-E. He is well known for his energetic to fiery sets and stripped-down club-focused productions. \n\nHe boasts releases on world-class labels such as Dixon Avenue Basement Jams, Dark Entries, Super Rhythm Trax, Hilltown Disco, and others. His productions have garnered support from giants such as @PaulWoolford, @Andrew-Weatherall, @Dave-Clarke-dj-sets, just to name a few, and has made guest spots on BBC1 and Rinse FM. \n\nLock in for an hour of high-energy bangers that bring together elements of electro, rave, breaks, and more." },
    { id:"mix-58", title:"TOMBOLOMIXX 58", artist:"Emkay", date:"2021", duration:"59:56", genre:"House", cover:"https://i1.sndcdn.com/artworks-PzQSKMsizylNOHyG-yZIN6A-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-058-emkay", notes:"Emkay (Maria Korkeila) is a designer, DJ and producer currently based in Helsinki. Korkeila plays regularly at Helsinki's clubs from @PostBar to Club Kaiku and Stidilä, in addition to which she hosts a monthly radio show called Tête-à-Tête on @Ida_Radio Helsinki where she explores house, trance, or techno music from many perspectives. She releases music kind of everywhere, but do not miss out her track on @radiantlove IWD compilation among other artists as @roza-terenzi or @maara. Peace <3\n\n@emkaybymk" },
    { id:"mix-57", title:"TOMBOLOMIXX 57", artist:"Blender", date:"2021", duration:"36:39", genre:"", cover:"https://i1.sndcdn.com/artworks-Iq2B0PPKKzLOJpIu-r0bAmA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/mixx-057-blender", notes:"Found Blender (@yougetitall) surfing on the net. He turned to be a music curator for @Tissue-Magazine among other beautiful things. This mini mix is perfect to say goodbye to the summer, sitting in the beach, hot breeze, cold cocktail..." },
    { id:"mix-56", title:"TOMBOLOMIXX 56", artist:"Malt", date:"2021", duration:"58:22", genre:"Electro", cover:"https://i1.sndcdn.com/artworks-14g4cFuR973wFCQP-P5LhTg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/056-malt", notes:"Happy to have this huge producer from Los Angeles, Andrew Seo aka Malt (@malt_7). He's built a name for himself as a DJ in LA's scene with his gritty, high octane sets ranging from acid, breaks, electro, and leftfield techno. \n\n Whether you're listening to his productions, live sets, or mixes, Malt delivers a fully immersive experience, navigating thorugh house, electro, acid, and more moving ya body and mind like a piñata. \n\nAs for his productions, you'll find releases on Leisure Sports Records, Out Of Respect Records, as well as self-releases on his Bandcamp. He also hosts Capsule Radio (KCHUNG) and Red Bean Radio (VPN) giving a platform to his peers & friends to showcase their creative projects" },
    { id:"mix-55", title:"TOMBOLOMIXX 55", artist:"Aeesb", date:"2021", duration:"1:00:25", genre:"House", cover:"https://i1.sndcdn.com/artworks-Vcb8emMMAbX9rvS0-ATfrjQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomix-055-aeesb", notes:"Happy to introduce rising star @Aeesb. Born in Barbados, raised in South Carolina, and later migrated to Atlanta, she is passionate about creating for, encouraging, and advertising small and black-owned businesses, she describes it as her, \"duty to serve\" her community. \n\nShe started djing in 2018, taking house and techno influences from a variety of artists, with a very personal approach." },
    { id:"mix-54", title:"TOMBOLOMIXX 54", artist:"Savino", date:"2021", duration:"2:03:50", genre:"Psych", cover:"https://i1.sndcdn.com/artworks-cy2HvRvP3wzRJaqg-mymGRw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/podcast-toumbolo", notes:"The man! \n\nIntroducing Madrid's local hero @Savinoo. Big pleasure to have a dj and producer that is all about energy. He flows along all kind of genres like a snake flows around a river, straight out the bush. He is very inspired by root trance music, as well as percussions from different parts of the world with  glimpses of acid. Perfect music to dance at a 48h forest rave. We'll get soon to that hopefully. Anyway he definitely is someone not to miss.\n\nHe came to Tombolo TV, our beautiful studio and jammed for over two hours throwing several downtempo, breakbeat and rave thundertracksss. \n\nTracklist soon." },
    { id:"mix-53", title:"TOMBOLOMIXX 53", artist:"Materia Hache", date:"2021", duration:"40:58", genre:"Techno", cover:"https://i1.sndcdn.com/artworks-Nx62KVzfuEOXMg6P-T6vZ9g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/materiahache-tombolo", notes:"@Materia_Hache is a dj and activist from Madrid who gets lots of influences from the sounds of Detroit and Chicago. shwoshhhhhh ****\n\nhere's that good tracklistt\n\n01. Shinedoe - Artificial Era\n02. Smokin' Jo - Little Legs\n03. softcoresoft - Generating the Divine Within\n04. Stephanie Sykes - Blur\n05. Nur Jaber - Beyond Borders\n06. Claudia Anderson - Structure \n07. Rebekah - Lim\n08. Mary Velo - Distort \n09. Claudia Anderson - Synthesis \n10. Vaal - Mask\n11. Doc Sleep - Crème fraîche (Violet Remix) \n12. Octo Octa - Until the Moon Sets \n13. Xosar - Watching Waiting Wanting \n14. Rrose - 23 lashes\n15. Mary Velo - Misfit \n16. Ariel Zetina - Vanity 7 \n17. Paula Temple - Colonized\n18. Afrodeutsche - Drink \n19. Mor Elian - Basma \n20. Karen Gwyer - Faces on Ankles\n21. B Traits - I Feel The Music" },
    { id:"mix-52", title:"TOMBOLOMIXX 52", artist:"DJ Simlocked", date:"2021", duration:"41:50", genre:"Electro", cover:"https://i1.sndcdn.com/artworks-5zlEgXoHW43ynsqV-Uz9ljQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/dj-simlocked-tombolo-mixwav", notes:"Insanely happy to be introducing king DJ @Simlocked as part of our mix series. The producer who has released in serious labels as @planetariasoundsystem @noservicesorry or @habibibass has put a few electro and booty house anthems together for our enjoyment. Sit back, open a bottle of your finest and most expensive beer and open ya earssss :*" },
    { id:"mix-51", title:"TOMBOLOMIXX 51", artist:"Santiago", date:"2021", duration:"55:47", genre:"Reggae", cover:"https://i1.sndcdn.com/artworks-WLLhStNnbGRWrHI8-sm6IPA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/santi-mix-1", notes:"Santi is a good friend of mine, and one of the biggest record collectors I know. He spent 5 years in London digging over the most hidden corners, to bring you amazing pearls difficult to find anywhere else. He's just got back to the hood and is now hosting a show in @radio-relativa called 54 WANKIGH STREET, the street where he lived, during that happy period of time. S/o to Freddy, Jorge and Mateo. @santimlvn\nLink down!\n\nhttps://radiorelativa.eu/show/54-wakigh-street/" },
    { id:"mix-50", title:"TOMBOLOMIXX 50", artist:"Antpuke", date:"2021", duration:"1:00:13", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-Dyn2nWMPK3aPVO5R-hs0ttw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-053-antpuke", notes:"Here comes @antpuke, an energetic and bombastic trans artist that breaks down this mix to the sounds of ballroom, PC Music, club, industrial, rave and hardcore. toppppp tier!" },
    { id:"mix-49", title:"TOMBOLOMIXX 49", artist:"You_El", date:"2021", duration:"1:04:16", genre:"Cosmic Disco", cover:"https://i1.sndcdn.com/artworks-yGYn0Ym13yjTd5u5-YxkrLg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/youel-tombolomixx", notes:"@You_El89 aka Ripao is probably one of the most active guys in the galicean shores regarding the fight for promoting underground culture. A guy that has been in the scene for more than 15 years, throwing events and playing all over, he just delighted us with this cosmic disco selection, so you can relax with a gin & tonic in an upcoming spring season. Aaachis!" },
    { id:"mix-48", title:"TOMBOLOMIXX 48", artist:"Victor Reyes", date:"2021", duration:"1:08:05", genre:"Electro", cover:"https://i1.sndcdn.com/artworks-LGWyz5GOQ9ygkMAc-tVdoRg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/victor-reyes", notes:"@djVictorReyes is a 29 year old Tenerife born and raised digger and producer. For the last 8 years, he has been collecting records of all genres, and expanding his knowledge and understanding of electronic music.\n\nIn this all vinyl set, the first one he has recorded in over two years, he shares his Electro and Techno influences, dropping banger after banger from artists such as Drexciya, Gosub or other lesser known gems." },
    { id:"mix-47", title:"TOMBOLOMIXX 47", artist:"Frinda di Lanco", date:"2021", duration:"1:12:50", genre:"Progressive", cover:"https://i1.sndcdn.com/artworks-hjRR1KLamhVy2HdK-1tzycA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-047-frinda-di-franco", notes:"@Frinda_di_Lanco ’s selection ranges from cosmic, disco, italo and synth-pop to wave, new beat and house music. She frequently occurs in clubs around her hometown Berlin, debuted at festivals like Primavera Sound and Fusion Festival in 2019 and appeared in clubs like About Blank Berlin, Szpitalna 1 Krakow, Tell Me Sofia, Forestlimit Tokyo, Arkham Shanghai and Tag Chengdu. With her partner @Hendrik_Stein she is running \"@Avec_Plaisir_Records\" to unveil and reissue forgotten jams.\n\nIn her mix she took a rather dance-y approach. As she said to me: \"I was in a quite aggressive mood yesterday. I have two jobs and can't work in both of them since months because of Covid. So that's why I called it \"Progressive Aggressive\" – after I recorded it, I felt much better!\"" },
    { id:"mix-46", title:"TOMBOLOMIXX 46", artist:"DJ Feet", date:"2021", duration:"1:09:57", genre:"Hip-hop & Rap", cover:"https://i1.sndcdn.com/artworks-wvJsTw7O4zosQ1yp-6us6dg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/dj-feet-tombolomixx", notes:"Interested in rap español¿ Madrid local DJ Feet (@feetofeeto) brings you the sauce with a selection of many of the most proliferic spanish rap anthems from the 90's-00's. SFDK, Mucho Muchacho, Frank T, Tote King, Violadores del Verso and many others old school artists, who shaped the early days of Hip Hop in Spain, as well as our childhood. Times of baggy pants, fat caps, bandanas, discmans, and buffalo sneakers.\n\nDJ Feet is not only my friend but a walking music enciclopedia that inspires Tombolo a lot to work. Besides being the co-founder of @radio-relativa, (a community radio based in Madrid) he is an avid record collector who has been playing for over a decade in several local parties and iconic radios such as @thelotradio. 1/3 of Fetuccini Boys, they just released \"Ballinstraße\" their first EP, in tape format who comes with a beautiful smoking pipe. Check it out in their bandcamp! https://fetuccini.bandcamp.com/album/ballinstra-e\n\nTráelo aquí!" },
    { id:"mix-45", title:"TOMBOLOMIXX 45", artist:"KSETDEX", date:"2021", duration:"56:56", genre:"Jungle", cover:"https://i1.sndcdn.com/artworks-Sy2rpTHT71TGrNAc-9W8NRA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-045-ksetdex", notes:"KSETDEX, the NAME.\n\nChicago junglist, producer and beatmaker. She's been making music for a big while now, combining many influences from phonk, ill rap and breakbeat but jungle and drum n bass is her main inspiration to create that raw sound. KSETDEX has self-released jungle tracks throughout the 2010's, as well as in labels like our beloved DARKNET, or through the guys from Doomshop (Cursed, Akoza).\n\nThis mix is absolute heaven. Featuring both old and new skool tracks across hard-hitting side of the drum & bass, it's literally like a slap in ya face.\n\n@KSET-DEX" },
    { id:"mix-44", title:"TOMBOLOMIXX 44", artist:"Vinski", date:"2021", duration:"49:21", genre:"Techno", cover:"https://i1.sndcdn.com/artworks-Wy1lImnpKGomAs6p-yIK5oA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomix-vinski", notes:"@VINSKI666 Straight from Vienna delivering heavy techno tracks. We crossed through the net one day and just really crushed with his sick mixes and productions (for @lowincomesquad among many others). There's even a tracklissssttttt for this sssset:\n\nPan Sonic - Lähetys / Transmission [DJ Nobu]\nBasic Channel - Phylyps Trak [BC02]\nBR1002 - Experience One [OVR002]\nR-325 - A1 [BT52]\nRX-101 - FM Bells [suction050]\nDRAAG - physxxxxx\nHiroaki Iizuka - Reflect [MORD073]\nJoel Mull - Untitled (Advent Remake) [CODERED10]\nDJ HEADWOUND - PLASTIC RAINDROPS\nSP23 - This Is Trance\nPenelope’s Fiance - Don't give up on me (As days are passing by) [EMOTIONAL WAVES]\ndj salazar - rove [PUPPY23]\nMarcel Dune - Asylum Anthem [LI$021]\nThe Advent - C2 [MORD065]\nReproach - Magnet 2000 [Acid Flash]\nHiroaki Iizuka - Gold [Audio Assault]\nSugar - Keep The Wounds Clean [KULOR007]\nOle Mic Odd - Chromed Out 1100 [Natural050]\nR-325 - B1 [BT52]" },
    { id:"mix-43", title:"TOMBOLOMIXX 43", artist:"Dee Jay Alicia", date:"2021", duration:"1:01:18", genre:"Soulful House", cover:"https://i1.sndcdn.com/artworks-RMykqiPfccQytUuT-ylA35A-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-043-deejay-alicia", notes:"Dee Jay Alicia aka @DJ-Alicia is a dj from Chicago who began her DJ career in 1996 under the guidance of DJ Raphael. Her musical beginnings were rooted in soul, steppers and R&B. Not much more to say as this mix is a bliss, full of energetic beautiful house tracks that will purify your soul. As she says... \"Whether a “bar star DJ” or “internationally known” the passion is no different. Music is my first love and it will be my last! And you thought all we did was play records…\"" },
    { id:"mix-42", title:"TOMBOLOMIXX 42", artist:"Pick A Piper", date:"2021", duration:"1:00:00", genre:"Psych", cover:"https://i1.sndcdn.com/artworks-D8rBghBeBkfPz9Rz-yNDqRg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/pick-a-piper-tombolo-live-mix", notes:"@PickaPiper is the project of Ontario electronic experimentalist Brad Weber, also the drummer for psych-pop-house band @Caribouband. His live combines energetic elemental rhythms, hypnotic electronics and enchanting melodies having got him to play in festivals such as @Mutek_Montreal.\n\nSlow-rave, melancholic pop confections built from polyrhythms and lush textures, Pick A Piper productions aim for the heart and the body—layering atmospheric sound design and club-informed structures filled with feels." },
    { id:"mix-41", title:"TOMBOLOMIXX 41", artist:"Tahinii", date:"2021", duration:"56:34", genre:"Park", cover:"https://i1.sndcdn.com/artworks-yiU3AmydRiMz0Et4-vcqS5Q-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-042-tahinii", notes:"Woooohoooo!\n\nStr8 from Naarm comes young @Tiana-Zimmermann aka Tahinii. Discovered her quite a while ago while diving through soundcloud and got instantly catched by her particular style of music selection. Downtempo beats, ambient melodies, with a beautiful acid baseline all mixed up with an amazing style. Check her out as she might be one good rising starrrr to followww ***" },
    { id:"mix-40", title:"TOMBOLOMIXX 40", artist:"DJ LOSER", date:"2021", duration:"30:40", genre:"RAVE", cover:"https://i1.sndcdn.com/artworks-4PnfbVzTiAbA87yR-9zUyeQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/djlosermix-january2021", notes:"Not much to say, no need of introduction. It's not halloween, but looks like it. Straight from Thessaloniki, Greece, spooky DJ Loser (@loser111) delivers this killer mix packed with stomping techno, trance and hoofing acid tracks. \n\nCannot wait to be back out there in the mud again :___-)" },
    { id:"mix-39", title:"TOMBOLOMIXX 39", artist:"Stefan Traj", date:"2021", duration:"57:06", genre:"Microhouse", cover:"https://i1.sndcdn.com/artworks-SRLvR5OS2VyJ4JV0-f0V1Jw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/stefan-traj-tombolo", notes:"Stefan Traj is one of two in @trajmusic a couple of brothers that play along the city of Melbourne, Australia. They opened @pitchfestival in Australia the same edition I went to (March 2020, last festival on earth before the pandemic) and found really funny that i got a message from them couple months later. Classic life casualties. They are very influenced about deep, dub, or micro house, and specially Giegling label, which is all about this kind of low key beats and flat melodies." },
    { id:"mix-38", title:"TOMBOLOMIXX 38", artist:"Toyacoyah", date:"2021", duration:"1:04:08", genre:"Drum & Bass", cover:"https://i1.sndcdn.com/artworks-TENoVowkv6ezZ655-zt3ndw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/toyacoyah", notes:"For those Drum n Bass and Jungle lovers... \n\n@Toyacoyah is an avid record collector from Chicago that has been DJing since the late 90s. While her musical collection consists of hip hop, freestyle, and Prince records, her main love is drum n’ bass. Her way of playing and sets lean towards the jazzier, soulful, and liquid funk side of drum n’ bass, but she can drop some heavy hitters when necessary; as she shows in this particular mixxxxx FULL of bangers. Dont pretend you're not using shazam on this one..\n\nTurn upp!!!!" },
    { id:"mix-36", title:"TOMBOLOMIXX 36", artist:"Jimbo Frank", date:"2020", duration:"57:16", genre:"House", cover:"https://i1.sndcdn.com/artworks-M4iUF3JAzscj6iSb-yPrRjQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/jimbo-frank-x-tombolo", notes:"@Jimbo-Frank is a new friend of mine. Our paths got crossed through the internet while surfing some tracks. He is a dj and producer from Barcelona who enjoys playing and making music. Lay back, relax and have fun!" },
    { id:"mix-35", title:"TOMBOLOMIXX 35", artist:"Ivy Barkakati", date:"2020", duration:"1:10:36", genre:"House", cover:"https://i1.sndcdn.com/artworks-ESn2clk8X8OMzzGN-yqUUaQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-035-ivy-barkakati", notes:"Ivy Barkakati (@IVDB) is a DJ, producer, and vocalist originally from the Maryland suburbs of Washington, DC. She has lived in Barcelona since 2012. For the past four years she has hosted the show Casa da Crega on the online radio station dublab.es. She is in the groups Proceed (with @EnekoBalza) and IVAN (with @Phran) and has released on labels such as @buttersessions.\n\nShe came to play before our beloved Fatima when we brought her in 2019. This mix is blisss; full of soulful house and afro influences, jazz and disco music. Enjoy" },
    { id:"mix-34", title:"TOMBOLOMIXX 34", artist:"Mr. Ho", date:"2020", duration:"1:03:31", genre:"Breaks", cover:"https://i1.sndcdn.com/artworks-Ccv6pUWGXWwHGkmE-uly99Q-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-034-mr-ho", notes:"Ho, ho ho! \n\nMichael Ho aka @MrHo is the co-boss of my admired @klassewrecks record label among @lucalozano. From Hong Kong, to Berlin, this man has released bangers in places such as @clone-nl, @esp-institute or @cremeorganization, and played in just about every city with a nightclub. Expect to see him in Madrid soon when this pandemic is over. Sooo grateful for his workkkk... so many tracks played in so many parties....yesyesyesss..... \n\nThis bomb of a mix, full of electro and breaks; blows up the remainder of a turbulent 2020 and will send you into 2021 on a high as the next year will be.\n\nHAPPY NEW YEAR <3" },
    { id:"mix-33", title:"TOMBOLOMIXX 33", artist:"DJ Marcelle / Another Nice Mess", date:"2020", duration:"1:01:36", genre:"", cover:"https://i1.sndcdn.com/artworks-5l3pxXLHvzfx2hpf-sKj2SQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-032-dj-marcelle", notes:"For those who don't know her, DJ @Marcelle is one of a kind... A rare combination of things: innovative, unpredictable and funny. She’s in that league of artists who are out there, doing and enjoying their own thing, for the pure art of it all. \n\nFor the past decade and a half, this flying Dutchwoman has been making bodies move, shaking audiences all over the world. Her weapons? Three vinyl decks, crafty pickings from from her 20,000 vinyl collection and a very singular spirit.\n\nThis mix is suuuuper. We couldn't have asked for more. Music from all over the world, times, and genres.\nThanks @marcelle <3" },
    { id:"mix-32", title:"TOMBOLOMIXX 32", artist:"Arthur More", date:"2020", duration:"1:00:56", genre:"World", cover:"https://i1.sndcdn.com/artworks-6glwchX7eP5ybmVu-dbSPfQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/201201_0138mp3", notes:"Welcoming this very special mix from my friend Arthur More; founder of the iconic label @glossymistakes. \n\n\"For this mix I tried to erase the genre tags rationally attached to music, working on a progressive narrative instead.  Recorded on vinyl with a laid back approach you will listen to obscure ambient from Korea all the way to New Wave, finishing up with a lovely psychedelic ballad. \n\nSongs from all continents play in this carefully selected trip hoping it heals your soul a bit.\n\nLots of love for Tombolo, OG Juan and all of you.\nxxx\"" },
    { id:"mix-31", title:"TOMBOLOMIXX 31", artist:"Tomu DJ", date:"2020", duration:"1:00:00", genre:"Hip-hop & Rap", cover:"https://i1.sndcdn.com/artworks-E2BHWmXu0sDnXOXp-uQ7VhA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-031-tomu-dj", notes:"Aighttt! @Tomu-Dj just got to the house. Based in NYC, Miss Tomu is a fire dj and trackmaker, who used to run parties with her collective Girls House. She is currently working on her debut album, getting a lot of hiphop influences, to make ethereal breakbeat, and house music. \n\nThis mix is FULL of 00's rap and bangers, a little glimpse of being at a club with all the rapersss." },
    { id:"mix-30", title:"TOMBOLOMIXX 30", artist:"Sr Melles", date:"2020", duration:"1:00:05", genre:"", cover:"https://i1.sndcdn.com/artworks-R8vyzmT8TzDJRVON-831jBA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-030-sr-melles", notes:"@Sr-Melles is a very good friend of mine. He's a fine selector from Madrid, being one of the curators of @Chineurs-de-Madrid, a young collective of artists and selectors that throw parties and broadcast emerging new talent. He also hosts a show at @radio-relativa called Breakfast Club, pretty fun program btw. \n\nAhh and he enjoys to do the two best sporrts in the world which are surfing andd skating. Enjoy this deep mix, with lots of giegling influences, and let yourself go within this winter dayzz.." },
    { id:"mix-29", title:"TOMBOLOMIXX 29", artist:"Papito Pepito", date:"2020", duration:"56:18", genre:"Internet", cover:"https://i1.sndcdn.com/artworks-Hdt0N5Lh6oc17B6J-5ilZeQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/papito-pepito-for-tombolo", notes:"King of Internet, Master of the DeepWebb, Lord of Trolls, Papito Papito does not come from this world. Some say he's not human... Some say he's a bug in the system...\n\nHe just landed with one of the chunkiest selections I've ever seen :* PC Music, ol skool spanish anthems, videogame cumbia... Idk i can't even label it. Just allow yourself to make some changes in ya software, and get carried along this trippy journey through this magic carpet ride... \n\nThere's even a tracklist :) Enjoy babiess <3 \n\nSega Bodega - Salv Goes to Hollywood\nMeth Math - Perreando y llorando\nGFOTY - cool\nLorenzo Senni - THINK BIG \nTodoTodo - Completamente De Rollo\nPC Engine Alice in Flagland Intro\nKarl (aka Bogdan Raczynski) - Dance your joy\nRui Ho - Berserk\nYem Gel - Chalcedony's Lament\nOli XL - Clumsy\nSebastian Orellana & Lorenzo Soria - Caleuche (con Martín Benavides)\nLos Pirañas - Lambada de Oceania, Africa y America\nDestiny boy Ft Tekno - JOGODO Fuji Version\nBurgaBoy - Love At First Sight\nToel Nakarotti Esso - Raja humeda\nCecilio G -Sin ti muero" },
    { id:"mix-28", title:"TOMBOLOMIXX 28", artist:"Pascale Project", date:"2020", duration:"1:01:15", genre:"Space", cover:"https://i1.sndcdn.com/artworks-zbUvSeNjwIyydz7R-pGlRzA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-028-pascale-project", notes:"Yay!! It's time for @PascaleProject! \n\nActive since 2008, the singer, producer and dj from Montréal is definitely one of the rising talents of her city. Pascale Mercier has an amazing taste when it comes to music curation. She has released several EPs in labels as @planeteuphorique or @orangemilk and remixed people such as @bluehawaii, managing her own label now \"Your Approval Isn't Needed\".\n\nIt's a real pleasure how smooth gets to be the journey when listening a piece like this one. This set combines music from yesterday and tomorrow, downtempo, ambient, outterspace breakbeats. Cosmic jungle hmmmmm\n\nEnjwoyyyy :3" },
    { id:"mix-27", title:"TOMBOLOMIXX 27", artist:"DJ Lynce", date:"2020", duration:"1:03:35", genre:"Breakbeat", cover:"https://i1.sndcdn.com/artworks-jE614EN5gq8zCpYl-2FgqoQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-026-dj-lynce", notes:"Heyyyy!! \n\nIntroducing Portuguese legend; dj and heavy record collector, Pedro Santos aka @DJLynce. Making an ode to one of his all time favorite labels: GLOBEX CORP, (seriously one of the finest hardcore, jungle music labels) he compiled some of his personal records into this heavy mix. Full ol skool breakbeat, drum n base and techno that will fire your hair up, i can tell you.\n\nWe had the pleasure of inviting him to one of our daylight parties in Madrid a few years ago and cannot wait to have him back. Enjoy!" },
    { id:"mix-26", title:"TOMBOLOMIXX 26", artist:"Joan Serinyà AKA John Heaven AKA John Pac", date:"2020", duration:"1:00:50", genre:"House", cover:"https://i1.sndcdn.com/artworks-7YqdHEVIyl7i1HQk-If35cg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/joan-serinya-aka-john-heaven-aka-john-pac-nitsa-mix-final", notes:"Woooohooo! Joan Serinyà AKA John Heaven AKA John Pac, from legendary @MainlineMainline gang just did a mix full of edits and gems for us. No explanation needed but the one he provided to us. And there's a tracklist to it this time :) @johnheaven4ever\n\n\"Esto es un mix monográfico de mí mismo, una selección de temas/remixes míos y algunas obras que he grabado como contrabajista en varias formaciones; un compendio personal a base de electrónica, música contemporánea, música antigua para grupo de cámara, sardanas de cine, música para cobla y varias producciones hechas en casa…\nGràcias por estar a mi lado,\"\n\nTracklist :)\nPablo Carrascosa - Less Is More (Live by Esmuc Ensemble)\nW.A.Mozart - Divertimento in Bb, K.137 - I. Andante (Live by Zaïre Ensemble)\nJ.Haydn - String Quartet Op.1 No.3 in D Major - V. Presto (Live by Zaïre Ensemble)\nRoque Baños - Sardana (Títulos) - BSO Ocho Apellidos Catalanes (Played by Bratislava Symphony Orchestra & Cobla Bisbal Jove)\nEnric Morera - Acte 1, Escena 3: Serafí - Era un Pobre Teixidor (Played by Josep Ramon Olivé and Cobla Marinada)\nBamba Samba - First Season\nJohn Heaven - Another Breaks\nBandolero - Paris Latino (John Heaven & Marcelo Pantani Edit)\nJohh Pac - Deep Whit\nJeff Mills - The Sun (John Heaven Edit)\nDj Bruce Lee - Beatz (John Heaven’s Pel Tiet Bruce Remix)\nJohn Heaven - Come\nJohn Pac - 4U\nMescalina Cuts - 133\nJohn Pac - Quique\nLike A Tim - Milkshake (John Heaven Vocal Edit)\nJulio Iglesias - Ni Te Tengo Ni Te Olvido (John Heaven’s Dreamy Edit)" },
    { id:"mix-25", title:"TOMBOLOMIXX 25", artist:"NAP", date:"2020", duration:"1:19:28", genre:"Dancehall", cover:"https://i1.sndcdn.com/artworks-e8wpWVA2pFyZJNMU-NUekCA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolo-mix-nap-mix", notes:"@Napmusick aka Daniel Rincon is a Colombian-born, Montreal based artist. Besides this project, he is involved in insane stuff such as @Ambien-Baby with @d-tiffany, La Fe (a collaboration between him and Michael Red of Souns publishing references in labels as @if-only-uk) or the @Sonidoisla his label, putting out heavy electronic music that if u don't known yet you should definitely check.\n\nThis mix is very special as its full of latin bangers, mixing dancehall, reggae or dub, with smooth reggaeton jams, perfect for putting your booty to the piso on a day like this." },
    { id:"mix-24", title:"TOMBOLOMIXX 24", artist:"Ascot WW", date:"2020", duration:"1:00:13", genre:"House", cover:"https://i1.sndcdn.com/artworks-iETrVvIIWdBPHQKS-fofLQQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-o24-ascot-ww", notes:"@Ascot_ww is a player coming str8 from Milano. Matteo has been releasing music in @Dawl's (this piece is an artwork of him) and @Sweeney73's Tone Dropout Label where you absolutely should go and check Volumes 7,8 and 9. \n\nHe's just about to launch his own label \"Fear Of Dogs Records” with an EP that is ear melting, and just did this mix full of house and rave bangers, so you can evae yourself from your day by day pandemix routine. \n\nPiacere!" },
    { id:"mix-23", title:"TOMBOLOMIXX 23", artist:"Dionaldo", date:"2020", duration:"1:05:47", genre:"Disco", cover:"https://i1.sndcdn.com/artworks-VPE2Oycj1M5eaeHM-t7SNFA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-023-dionaldo", notes:"@ChebDionaldo is a very good friend from the fam. Based in Madrid he's a very interesting selector. He host a program in @radio-relativa called \"Bocata di Cardinale\" which as its name says, stands up for beautiful and sublime music. This mix is pretty trippy, disco, house (kinda downtempish), with such nice slow vibes. Just sit back and enjwoyyy **" },
    { id:"mix-22", title:"TOMBOLOMIXX 22", artist:"House Of Friends", date:"2020", duration:"1:09:00", genre:"House", cover:"https://i1.sndcdn.com/artworks-rqE3wmNlMksL9PGe-oLnjvw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-022-house-of-friends", notes:"@Houseoffriends is a crew based in Melbourne. @babycinoofficial @djyassas and Gin Mendoza organize parties as well as curating some of the hottests mixes in the australian territory. They were able to put this mix together from their separate homes during the quarantine what makes it unique, in the sense of showing that still with this CV times, everrrrything is possible! House, jungle, and super energetic trancy beatsss from the bush. \n\nEnjoy!" },
    { id:"mix-21", title:"TOMBOLOMIXX 21", artist:"Dj Saliva", date:"2020", duration:"1:01:21", genre:"Techno", cover:"https://i1.sndcdn.com/artworks-FzctCJVUWJry3oZt-NAPM9Q-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/dj-saliva-tombolo", notes:"Mauro Ventura aka Dj Saliva (@djjsaliva) is a portuguese artist based in Berlin. He is the founder of @ArenaSpaSuperiora, and is currently working curating visuals and artworks for @herrensauna. He likes to paint, and has put some insane exhibitions in Germany or Portugal.\n\nThis mix is pure bliss. Pure energetic broken beats, techno and electro. Same music you'd expect in a rave in the countryside or a dark basement full of dancing bodies, movement and sweat. Enjoy :3" },
    { id:"mix-20", title:"TOMBOLOMIXX 20", artist:"Goyo The Ghoul", date:"2020", duration:"1:01:58", genre:"PHONK", cover:"https://i1.sndcdn.com/artworks-iUuUQ0T8AbAKOYJu-OdefeQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-020-goyo-the-goul", notes:"@GoyoTheGhoul is a spanish rapper and producer based in Barcelona. He's been in the game for around 6 years now, making hip hop tracks from his home studio. 2020 is being a fucked up year, but not for him, as he released his major first solo tape \"Deidades y Monedas\" in May. 21 tracks of pure screw type memphis fat beats, with heavy lyrics over it, singing about graffiti and other adventures of the everyday life.\n\nIn this mix, he explores hip hop in all its genres, phonk, trap, lo-fi, cali among others melodies and styles. Light up a fat blunt and turn on the speaker." },
    { id:"mix-19", title:"TOMBOLOMIXX 19", artist:"MENEO", date:"2020", duration:"1:11:43", genre:"Latin", cover:"https://i1.sndcdn.com/artworks-UGpQzU3waz5jVYki-5Ofx5w-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-019-meneo", notes:"Rigo Pex aka @MENEO is a beast. \n\nThis Madrid based Guatemalan artist has gone from DJing at Primavera Sound with a gameboy to hitting the pitch with electropical rhythms at Sónar. From predicting the future of music at TEDx to giving a lecture on Iberian mashups at the Goya Awards party. He's been recording LATINATOR for 5 years, a weekly podcast on Radio3 Extra that serves as an archive for Latin American record labels (rtve.es/latinator). \n\nA really interesting mix that dives into latin music in all its forms. From cumbia to disco to deeper electronic music as many others. Fire in the hole!" },
    { id:"mix-18", title:"TOMBOLOMIXX 18", artist:"SSS", date:"2020", duration:"31:01", genre:"", cover:"https://i1.sndcdn.com/artworks-vyFGBnW3HXu7qKPT-l4zVYQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-018-sss", notes:"Stephanie Jean Weber aka SSS (@3xsss) is a london based fashion stylist and photographer. \n\nOur paths got crossed sssurfing through the depths of internet where I definitely got caught by her emotional taste into what selecting music respects, and here we are! :* Don't sleep on her first gig at Onetwentyseven in London in September if you're arounddd.\n\nAnyway, check out this very heavy minimix and jump onto a trance state of mind." },
    { id:"mix-17", title:"TOMBOLOMIXX 17", artist:"Agente Latina", date:"2020", duration:"58:45", genre:"huge", cover:"https://i1.sndcdn.com/artworks-snphmGSdvmnC9WAd-VOGeaQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-017-agente-latina", notes:"HUGE!!\n\nAgente Latina (@crisxu) is a dj from Madrid. Being an active member from girl collective K4rn3 Kulture (@user-603383713), she put out parties and events where you can find cheeky reggaeton as well as spooky electro beats, She has a program in @radio-relativa called Vanta Fido, where she talks about all types of psychedelic behaviours of human beings: love, addictions, hipnosis and many others crazy ass topics.\n\nCheck out this housy mix and jump on a journey full of different colors and styles,.." },
    { id:"mix-16", title:"TOMBOLOMIXX 16", artist:"Daniel Holt", date:"2020", duration:"51:54", genre:"Post punk", cover:"https://i1.sndcdn.com/artworks-WGij27pBzAXi18De-e8eyjA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-016-daniel-holt", notes:"Ayee!!\n\nDaniel Holt (@danielholtt) is a musician that lives in a small town outside of Nashville, Tennessee. He is well known for a very distinct sound combining and exploring industrial, darkwave, post punk and slow tempo techno brreaks. The Ardetha's boss has released amazing bombs in labels such as @L-I-E-S, @AperitifdelaMort, @Frigio-Records, and many others. \n\nEnjoy the deep, spooky bangers he throws in this mix." },
    { id:"mix-15", title:"TOMBOLOMIXX 15", artist:"Yuzo Iwata", date:"2020", duration:"1:08:11", genre:"Psych", cover:"https://i1.sndcdn.com/artworks-PRCydnahRJY4ahvJ-LZdsrA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-015-yuzo-iwata", notes:"Yuzo Iwata (@fabio-konair), is a Cuban/Japanese Berlin based DJ and producer who has an eclectic background that heavily influences his taste in music. Playing \"EPM\" (Eclectic Psychedelic Music) as no genre limitation, Yuzo carefully grasps the mood of the scene while delivering a deep and mind-expanding trip experience.\n\nFrom releasing heavy and fire-y bangers with @Buttersessions and @MalinGenie most recently, to tasty feel good mixes for @Trushmix, @lyl_radio to name a few. This spacey mix is nothing short of his style, inviting you on journey to expand your inner world. Get ya self a good cup of tea and enjoyy" },
    { id:"mix-14", title:"TOMBOLOMIXX 14", artist:"Robert Bergman", date:"2020", duration:"1:00:58", genre:"Acid", cover:"https://i1.sndcdn.com/artworks-1HRdJdHxcmUdCelb-UA7nQw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-014-robert-bergman", notes:"Young @Robert-Bergman is just puuuure music. He needs no introduction. Just to say if you don't know him, he is definitely one of the biggest selectors that have come to our parties in the past. He's been working at @rushhourrecords shop in Amsterdam for years now as well as being one of @dkmntl local dj and producer, also resident in parties at clubs like Trouw or De School. \n\nSuper honored to count with this heavy mix. Come and treat yourself along this journey, move your booty and let that brain travel throught this psychedelic pumping acid beats. Counting the days until clubs re open to have him again with us destroying the dancefloor." },
    { id:"mix-13", title:"TOMBOLOMIXX 13", artist:"Omega III", date:"2020", duration:"1:01:49", genre:"Jungle", cover:"https://i1.sndcdn.com/artworks-fSKCzvX8y1kQhpkq-5zUwsQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-013-omega-iii", notes:"@OmegaIII is a music and art connaisseur. You can find some of his beautiful productions and mixes for @LucaLozano 's @klasseWrecks label and even put together a @trushmix. He also curated the DJs Take Control series for @radioprimaverasound. \n\nWe had the pleasure of publishing this huge jungle mix selected by him. Pure old school banging riddims with some lo-fi influence that will make you bounce from ya chair in the office." },
    { id:"mix-12", title:"TOMBOLOMIXX 12", artist:"Yung Prado", date:"2020", duration:"59:46", genre:"House", cover:"https://i1.sndcdn.com/artworks-cHfUmekHsXkzJ4Zs-LYHgtQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-014-yung-prado", notes:"@YungPrado is as his name says, a young producer from Barcelona, Spain. He is part of rising stars Mainline Magic Orchestra (@mainlinemainline), a beautiful collective of friends who swim in an ocean of pure creativity in what music and image curating means. \n\nHe has just released a fucking cool EP in Dj Seinfield's label @youngethics called \"Que Pasa?\" yhat you definitely should take a look into: \"It’s cheeky acid basically, and once you learn some of the hilarious lyrics it’s an even bigger set of eagworms.\"" },
    { id:"mix-11", title:"TOMBOLOMIXX 11", artist:"Darcy Justice", date:"2020", duration:"1:07:16", genre:"Park", cover:"https://i1.sndcdn.com/artworks-gylJOmkZQMBcRHWi-KdSF5g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-011-darcy-justice", notes:"Introducing @DarcyJustice (@sunsetsounds1) from Melbourne Australia. An absolute queen who is well known in the local Melbourne club scene for her banging taste in music and dropping heavy down-tempo tunes. \n\nShe usually plays in @ButterSessions events and festivals such as @AnimalsDancing or Inner Varnika. This eclectic mix will blow your mind and send you around the world on a chugging deep journey. Darcy666 <3" },
    { id:"mix-10", title:"TOMBOLOMIXX 10", artist:"Pepperoni DJ", date:"2020", duration:"59:13", genre:"Biarritz", cover:"https://i1.sndcdn.com/artworks-nMD2pPDu1Ozqdh0o-huKmCA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-pepperoni-dj", notes:"Besides to be my brother,  Pepperoni DJ aka Carroquino (@alvaro-carroquino) is definitely one of my favorite djs. He has a pretty fun track record in what promoting, designing, and curating means. He is architecture studio \"Futuro Studio\" and @radio-relativa co-founder. Its also delightful to see him catching waves in a wild ocean, or flotaing on a crocodile ballon in a swimming pool.\n\nCheck out this perfect mix to pump up yourself with some piña colada after a long day at the beach or dance your ass off in a dancefloor with morning light." },
    { id:"mix-9", title:"TOMBOLOMIXX 9", artist:"Bergsonist", date:"2020", duration:"1:01:55", genre:"", cover:"https://i1.sndcdn.com/artworks-4trAzxtfacwzMv0K-zaa40g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-009-bergsonist", notes:"@Bergsonist aka Selwa Abd, is the ultimate moroccan techno super heroin. Originally from Casablanca, she's based in Brooklyn NY, and has released numerous eps in different labels such as @Borft, @Optimo-music or hers: BIZAARBAZAAR (@rocktea). She is part of women collective and promoter @discwoman and host a monthly program at @nts_live. Definitely one of the young musicians to keep an eye on in the next years.\n\nShe came to play in one of our parties back in 2019 in Madrid. Heavy live, pure analogic machines delivering fat beats, and intense melodies that made everyone jump around. This mix particularly blew my mind out as she puts together all kinds of music, going from arabic to classic deep house to reggaeton.\n\n#TOMBOLO #BERGSONIST #UNDERGROUND" },
    { id:"mix-8", title:"TOMBOLOMIXX 8", artist:"Arrogance Arrogance", date:"2020", duration:"59:41", genre:"Alternative Rock", cover:"https://i1.sndcdn.com/artworks-LUBxh9K4Hi6rxJiw-7b9hGA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-008-arrogance-arrogance", notes:"Introducing Arrogance Arrogance (@as10061), one of Porto's finest promoters and djs. Active in the portuguese scene for over 8 years, he's been throwing raves, and playing in parties with his collective ACIDA for a long time, getting to be in NOS Primavera Sound 2020's line up (cancelled because of this fucking pandemia). We had the pleasure to collab with him a few years ago, where they hosted the whole crew in Porto for a rave and we got them back to Madrid for a daylight exhibition party.\n\nHe is a booty electro expert but gets his influences from classic, portuguese and psychedelic rock as we can see in this heavy heavy set. Enjoyy" },
    { id:"mix-7", title:"TOMBOLOMIXX 7", artist:"Eden Burns", date:"2020", duration:"54:38", genre:"", cover:"https://i1.sndcdn.com/artworks-jXO7e22smFC6jLyl-8ltbzw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-007-eden-burns", notes:"Eden Burns (@djedenburns)aka Speedboat is a DJ and producer from Dunedin, New Zealand. \n\nHe is part of @Sandboards having released music on  @FeelmyBicep, Cold Tomic and has recently released music on his own for @PublicPossession inspired by “a group of stray felines of all shapes and sizes based in The Taieri, behind the old RSA building”.  He also started a label and party series, Head Rush Enterprise and have been throwing parties in Melbourne, Australia. \n\nKick back and enjoy his diverse taste in music, going on a deep exploration through rock music to downtempo electronica.\n\n#TOMBOLO #NZ #EDENBURNS" },
    { id:"mix-6", title:"TOMBOLOMIXX 6", artist:"Mutant Joe", date:"2020", duration:"1:00:13", genre:"", cover:"https://i1.sndcdn.com/artworks-FtCyZHBoEI2KTzYJ-J0ZIzQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-006-mutant-joe", notes:"Aye!! Young Mutant Joe (@mutantjoe) is a 20 years old producer from Brisbane, Australia. Making his debut with album “Home Invasion Anthems” on Manchester label @NaturalSciences a few months ago, Mutant Joe peels back societies accepted norms and values, kicking down the door of the family next door armed with razor wire, bondage tape, police transmitters and overt torture tactics. \n\nHe has collaborated with big names such as @FreddieDredd or Lord Pusswhip, and is definitely earning the respect of firms as FACT or Inverted Audio, caughting the eye of TNGHT (Hudson Mohawk x Lunice) who dropped four tracks from him in their BBC Radio 1 Essential Mix at the tail end of 2019.\n\nMemphis rap, jungle, trap, grime, breaks and street electronics, Mutant Joe drops massive weapons all along the mix. Hold on tight to your couch, this is gonna blow ya mind." },
    { id:"mix-5", title:"TOMBOLOMIXX 5", artist:"Egyptian Lover", date:"2020", duration:"59:56", genre:"808 BEAT", cover:"https://i1.sndcdn.com/artworks-UfzC0LjXNmlrYxqz-7D8KLw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx005-egyptian-lover", notes:"The man himself, someone who doesn't need any introduction. \n\nGreg Broussard aka Egyptian Lover was with us for one our first parties back in 2018. We flew him straight from LA just for the party, and spent the whole weekend showing him around Madrid. We ate eggs with jamon, drank vermouths in a thousand bars, record shopped and enjoyed everywhere along the city center.\n\nLast night before he left, he came to @radio-relativa studios with his bag full of records, and recorded this mix for us. He played in the most original way, backspinning, scratching, playing the records backwards and a long etc of movements never seen in anyone else. True original 808 beats from his own. We were around 25 people dancing in the studio, bought pizza and beer for everyone, and had probably one of the most special moments of our life in this game. At 8h08 no matter if morning or afternoon he would send a message asking \"What time is it?\" as well as making some paintings for the crew. Humble and genuine, from anyone we've worked with, definitely one of the most amazing people.\n\nLose yourself within this heavy heavy heavy mix from the genius, the pioneer, the legend EGYPTIAN LOVER <3" },
    { id:"mix-4", title:"TOMBOLOMIXX 4", artist:"NAD1A", date:"2020", duration:"59:45", genre:"OUTTERSPACE", cover:"https://i1.sndcdn.com/artworks-7wHSgfUuUdHymPdr-W1Lyzw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-004-nad1a", notes:"Nad1a (@nnad1a) is a dj and promoter from Madrid. Active member from girl collective K4rn3 Kulture (@user-603383713), she throws parties where outter space reggeaton as well as strambotic breaks are in the essence of their nights on a thursday basis. Going from some weird Whitney Houston breaks to portuguese kuduro (culo duro), from geeky reggaeton to garage she takes you around a wholesome trip.\n\nDude this mix is so emotional, I've been perreando while lloraba the whole afternoon primo. <3 <3 <3" },
    { id:"mix-3", title:"TOMBOLOMIXX 3", artist:"DJ F", date:"2020", duration:"56:57", genre:"Detroit", cover:"https://i1.sndcdn.com/artworks-XhPDTHyPriMZr8HM-pZpTnA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx003", notes:"DJ F aka Ideograma aka Flavio to friends (@djf-aka-ideograma) is one of Madrid's true legends. Owner of record shop Recycled Music Center now turned into Palma39, he's been around 30 years dedicated to the game. Starting his career in 1992, he's always been influenced by styles as 90's IDM, or Detroit Techno. He is by far one of the best deejays that I know. \n\nHad the pleasure to have him in the line up with Egyptian Lover in one of Tombolo's first parties for the closing set. It was sickkkkk af!!!\n\nLet yourself groove to some of this beautiful gems he's bringing while you get dressed for your prom night... <3" },
    { id:"mix-2", title:"TOMBOLOMIXX 2", artist:"DJ Gostoso", date:"2020", duration:"1:01:19", genre:"Dancehall", cover:"https://i1.sndcdn.com/artworks-b4Xw5qLvG1OI9Mic-EEm5jA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-002-dj-gostoso", notes:"DJ Gostoso (@lvaro-de-le-n) is the ultimate brincadeiro from Madrid. Being one of @radio-relativa bosses, his influences go from that good old Miami Bass to the sketchy baile funk carioca. Always keepin that sexta feira spirit, Gostoso brings you the freshest sound from and for the club. This mix is ideal to shake that booty and let yourself go or chill with a beautiful gin on hand. \n\nThis dude is true og." },
    { id:"mix-1", title:"TOMBOLOMIXX 1", artist:"Estatua de la Libertad", date:"2019", duration:"1:00:49", genre:"Música del mundo", cover:"https://i1.sndcdn.com/artworks-nTzYhW1SzgpKAkJA-NEyyYg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolo-podcast-001-lato-a", notes:"Adriana Casado aka Estatua de la Libertad aka Lato A (@latoestatua) is an active dj and promoter based in Madrid. She is a founding member of Madrid experimental community radio Radio Relativa as well as part of Real No Real and Unlocked Youth collectives. RNR is probably one of the most influential and ambitious music projects in the city, due to the curation of line ups and scenography of the events. \n\nAdriana explores latin music in all its forms, genres and timelines; waving between different styles such as Balearic, dub or reggae in her sets." }
  ],
