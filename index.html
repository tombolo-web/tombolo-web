  livesets: [
    { id:"live-1196674822", title:"Byron Yeates", artist:"Live @ Tombolo Club", date:"2022", duration:"1:55:30", genre:"Live", cover:"https://i1.sndcdn.com/artworks-fP0pjfnKzHzKR2NT-baLynw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/byron-yeates-tombolo-club", notes:"2h of heavy hitters by @byronyeates. Live at Tombolo Club on the 5th of January 2022." },
    { id:"live-634581750", title:"DJ Dustin", artist:"Live @ Tombolo Club", date:"2019", duration:"2:03:13", genre:"House", cover:"https://i1.sndcdn.com/artworks-000551552523-33x88e-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/dj-dustin-tombolo-madrid", notes:"► German flavor. Dj Dustin from @Giegling with a very special closing for the first time in Tombolo.\n\nFollow @tombololive for more :* !!!!!\n\nFULL VIDEO HERE: https://www.youtube.com/watch?v=aR93XQv9WCM\n\n\n\nYT: https://bit.ly/2IjAh4r\nW:  https://tombolo.live\nFB: https://facebook.com/tombolooo\nIG:  https://instagram.com/tombolo.live" },
    { id:"live-634583226", title:"Textasy", artist:"Live @ Tombolo Club", date:"2019", duration:"3:01:46", genre:"Techno", cover:"https://i1.sndcdn.com/artworks-rCHjsqcdaCDL1Ogl-HfNrvQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/textasy-tombolo-madrid", notes:"► Straight outta Dallas. @aciddallas The king of breakbeat smashes Madrid for the very first time. \n\nFOLLOW TOMBOLO HERE: https://bit.ly/2IjAh4r\n\nALSO.....\nW:  https://tombolo.live\nFB: https://facebook.com/tombolooo\nIG:  https://instagram.com/tombolo.live" },
    { id:"live-589637475", title:"Egyptian Lover 808 Live", artist:"Live @ Tombolo Club", date:"28 SEP 2018", duration:"1:52:24", genre:"Electrónica", cover:"https://i1.sndcdn.com/artworks-fWmJsZ6pLZsEvbVr-Md9h7g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/egyptian-lover-live-tombolo-madrid", notes:"►The electro pioneer live for Tombolo in Madrid\n\n:D Subscribel!\n\nW: www.tombolo.live\nFB: facebook.com/tombolooo\nIG: instagram.com/tombolo.live" },
    { id:"live-2056484944", title:"Fredfades", artist:"Live @ Tombolo Club", date:"2025", duration:"2:18:10", genre:"Live", cover:"https://i1.sndcdn.com/artworks-GR94wwDyyaySotRQ-SEhTkw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/fredfades-tombolo-club", notes:"Live recording from @fredfades set at our regular Tombolo Club party in Madrid a couple years back! \n\nHere's a few words by Fred about the mix: \"Listening back, I do believe this is me at my very best - but that’s thanks to the floor. I can re-experience the room over again just by listening to the recording. Pure energy and pure magic. Connection with the crowd. You give, I give back. You move, I move with you - and this can be heard clearly by the way I played my records that night. Thanks to Juan for making it happen\"\n\nPhoto by Jørgen Urke" },
    { id:"live-1367396179", title:"DJ Assault Live", artist:"Live @ Tombolo Club", date:"2022", duration:"1:53:22", genre:"Live", cover:"https://i1.sndcdn.com/artworks-HlZyyVS2SMKK6s56-aFzrGA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/dj-assaultwavv2", notes:"Ladies and gentlemen...\n\nThe one and only @djassault delivering at Tombolo Festival" },
    { id:"live-1388316463", title:"Reptant x Tombolo", artist:"Live @ Tombolo Club", date:"2022", duration:"1:01:55", genre:"Electro", cover:"https://i1.sndcdn.com/artworks-BRkwVd8jtwKIWbqz-ZDK4vg-t500x500.jpg", scUrl:"https://soundcloud.com/radio-relativa/tombolo-w-reptant", notes:"@reptant_the_lizard played some tunes at our studio after the big party @tombololive organized in Siroco. Enjoy the music!" },
    { id:"live-813308245", title:"Victor Kiswell live", artist:"Live @ Tombolo Club", date:"16 NOV 2019", duration:"2:34:06", genre:"World", cover:"https://i1.sndcdn.com/artworks-Bh3u5D8W1k7jVb45-Kam4cg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/victor-kiswell-live-tombolo", notes:"Hosting one of the biggest diggers of the world, Victor Kiswell (@victor-kiswell) came to our party in Madrid for the first time ever in collaboration with Madrid's independent radio @radio-relativa\n\nTwo and a half hours full of real world music, making the crowd sweat the dancefloor as we've rarely seen :)" },
    { id:"live-1357274479", title:"DJ Fett Burger x Tombolo", artist:"Live @ Tombolo Club", date:"2022", duration:"1:30:52", genre:"easy listening", cover:"https://i1.sndcdn.com/artworks-eDA3fcmAdH868jnW-YyP5sA-t500x500.jpg", scUrl:"https://soundcloud.com/radio-relativa/dj-fett-burger-x-tombolo", notes:"@djfettburger played some tunes before his closing set at @tombololive Festival. Enjoy the music!" },
    { id:"live-1013385526", title:"Chico Blanco & 8kitoo", artist:"Live @ Tombolo Club", date:"20 MAR 2021", duration:"1:24:51", genre:"House", cover:"https://i1.sndcdn.com/artworks-mAXZ4zCMb4Od9Vt0-gP0OQw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/chico-blanco-8kitoo-tombolo-tv-20032021", notes:"@Chico-Blanco & @chokitoklein are the hottest djs in Granada atm. Playing for 1h30 in our beloved TV show in twitch, it's full of bangers\n\nSEE FULL VIDEO HERE: https://www.youtube.com/watch?v=LVgTRqYtk0Q\n\nSubscribe to all our platforms!\n\nwww.linktree.com/tombololive" },
    { id:"live-2270213849", title:"Tombolo", artist:"Live @ Tombolo Club", date:"2026", duration:"2:58:49", genre:"Live", cover:"https://i1.sndcdn.com/artworks-PwI0pjJiierWVJka-lwJEWw-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolo-x-telephones-schmusi", notes:"Three sweet hours of music with Telephones, Elio & Mo (Schmusi Kollektiv) and OG Juan, prior to a funtastic night at Club 110." },
    { id:"live-589660851", title:"Pal Joey All night long", artist:"Live @ Tombolo Club", date:"23 NOV 2018", duration:"5:45:54", genre:"House", cover:"https://i1.sndcdn.com/artworks-000503613501-o4q51n-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/pal-joey-all-night-long-tombolo-madrid-1", notes:"►NY House legend @pal-joey sharing jams all night long in Tombolo Madrid" },

<script>

const I18N = {

  },
  en: {
    upcoming:"Upcoming", archive:"Archive", upcomingBadge:"Upcoming", pastBadge:"Past",
    eventsCount:n=>`${n} events`, releasesCount:n=>`${n} releases`,
    date:"Date", city:"City", venue:"Venue", lineup:"Line-up",
    duration:"Length", genre:"Genre", cat:"Catalogue", format:"Format", year:"Year", tracklist:"Tracklist",
    tickets:"Tickets →", pastEvent:"Past event", viewRA:"View on Resident Advisor ↗",
    viewSC:"View on SoundCloud ↗", buyListen:"Buy / Listen →", contact:"Contact & social",
    heroLead:"Contributing to the electronic music scene of the city!",
    marquee:["See you at the club"], aboutMeta:"est. 2018 · Madrid"
    ,nf1:"We couldn't find that.", nf2:"Back to home"
  }
};
const LANG = 'en';   // sitio en inglés
const t = k => I18N[LANG][k];

/* Categoría activa en la pestaña Mixes: 'tombolomixx' | 'live' */
let mixCat = 'tombolomixx';
function setMixCat(c){
  mixCat = c;
  $app.innerHTML = viewMixes();
  renderDoodles('mixes');
}

const $app = document.getElementById('app');
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find = (list, id) => DATA[list].find(x => x.id === id);

function art(image, label, cls){
  const c = cls ? ' '+cls : '';
  if(image) return `<div class="art${c}"><img src="${esc(image)}" alt="${esc(label)}" loading="lazy"></div>`;
  return `<div class="art${c}"><div class="ph"><span>SUSTITUIR<br>IMAGEN<br>${esc(label)}</span></div></div>`;
}
function mediaImg(image, label, ratio){
  if(image) return `<img src="${esc(image)}" alt="${esc(label)}" loading="lazy">`;
  return `<div class="ph" style="aspect-ratio:${ratio}"><span>SUSTITUIR IMAGEN<br>${esc(label)}</span></div>`;
}
/* Dibujos DEMO (se usan cuando un doodle tiene src:"" para que veas el

/* Pinta los dibujos dispersos de la sección actual */
function renderDoodles(section){
  const list = (DATA.doodles||[]).filter(d => d.page==='all' || d.page===section);
  if(!list.length) return;
  const layer = document.createElement('div');
  layer.className = 'doodle-layer';
  layer.innerHTML = list.map((d,i)=>{
    const inner = d.src ? `<img src="${esc(d.src)}" alt="">` : DOODLE_DEMO[i % DOODLE_DEMO.length];
    const hide = (d.mobile===false) ? ' hide-mobile' : '';
    return `<div class="doodle${hide}" style="top:${esc(d.top)};left:${esc(d.left)};width:${parseInt(d.w)||100}px;
      --rot:${parseFloat(d.rotate)||0}deg;animation-delay:${i*0.12}s, ${0.55+i*0.12}s">${inner}</div>`;
  }).join('');
  $app.appendChild(layer);
}

function scIframe(url, big){
  const h = big ? 300 : 166, visual = big ? 'true' : 'false';
  const color = (THEME[location.hash.replace(/^#\/?/, '').split('/')[0]] || '#1E2DFF').replace('#','%23');
  const src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}`
            + `&color=${color}&auto_play=false&hide_related=true&show_comments=false`
            + `&show_user=true&show_reposts=false&visual=${visual}`;
  return `<div class="sc-embed"><iframe height="${h}" scrolling="no" frameborder="no" allow="autoplay" src="${src}"></iframe></div>`;
}

function viewHome(){
  /* --- Frases de la marquesina (traducidas en I18N[LANG].marquee). --- */
  const MARQUEE = t('marquee');
  /* Logo de Tombolo (dos figuras + ojos + aro) — versión vectorial en blanco.
     Aproximación del logo real; si tienes el SVG/PNG original lo sustituimos. */
  const MARK = `<svg class="mq-logo" viewBox="0 0 200 150" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M30 92 C24 84 30 76 40 80 C48 50 86 42 104 62 C116 74 110 96 92 96"/><path d="M90 94 C84 104 74 106 72 112"/><circle cx="60" cy="112" r="16"/><path d="M92 96 C104 48 152 46 172 76 C186 98 168 118 146 110 C150 126 156 138 170 148"/><circle cx="66" cy="72" r="12" fill="currentColor" stroke="none"/><circle cx="130" cy="82" r="12" fill="currentColor" stroke="none"/><circle cx="70" cy="74" r="3.6" fill="var(--accent)" stroke="none"/><circle cx="134" cy="84" r="3.6" fill="var(--accent)" stroke="none"/></svg>`;
  const unit = MARQUEE.map(t=>`${MARK}<span>${esc(t)}</span>`).join('');
  const ticker = unit.repeat(6);
  /* Muro de fotos + dibujos (estilo Public Records), repartido en columnas
     que se mueven a distinta velocidad al hacer scroll (parallax). */
  const itemHTML = (it,i)=>{
    if(it.kind==='drawing'){
      const rot=[-5,4,-3,6,-4,5][i%6];
      const inner = it.src ? `<img src="${esc(it.src)}" alt="">` : `<div class="ph" style="aspect-ratio:${esc(it.ratio||'1/1')}"><span>DIBUJO<br>(sustituir)</span></div>`;
      return `<div class="g-item g-drawing" style="transform:rotate(${rot}deg)">${inner}</div>`;
    }
    const inner = it.src ? `<img src="${esc(it.src)}" alt="" loading="lazy">` : `<div class="ph" style="aspect-ratio:${esc(it.ratio||'1/1')}"><span>FOTO<br>(sustituir)</span></div>`;
    return `<div class="g-item g-photo">${inner}</div>`;
  };
  const nCols = window.innerWidth<=640 ? 2 : (window.innerWidth<=1000 ? 3 : 4);
  const speeds = [0.04, 0.14, 0.07, 0.11];            // velocidad de parallax por columna
  const cols = Array.from({length:nCols}, ()=>[]);
  (DATA.homeGallery||[]).forEach((it,i)=> cols[i % nCols].push(itemHTML(it,i)) );
  const galleryHTML = cols.map((items,c)=>
    `<div class="g-col" data-speed="${window.innerWidth<=640 ? 0 : speeds[c%speeds.length]}">${items.join('')}</div>`
  ).join('');
  return `<div class="view">
    <div class="wrap">
      <section class="home-intro">
        <h2 class="hero-logo">Tombolo<span class="b">●</span></h2>
        <div class="hero-tag">Madrid, <em>since 2018</em></div>
        <p class="lead">${t('heroLead')}</p>
      </section>
      <div class="gallery-wall">${galleryHTML}</div>
    </div>
    <div class="marquee"><div>${ticker}${ticker}</div></div>
  </div>`;
}

function viewEvents(){
  const upcoming = DATA.events.filter(e=>!e.past);
  const past = DATA.events.filter(e=>e.past);
  const cardOf = e => `
    <a class="card poster" href="#/events/${esc(e.id)}">
      ${art(e.image, e.title)}
      <div class="body">
        <div class="t">${esc(e.title)}</div>
        <div class="s">${esc(e.date)} · ${esc(e.city)}</div>
        <div class="row"><span>${esc(e.venue)}</span><span class="badge">${e.past?t('pastBadge'):t('upcomingBadge')}</span></div>
      </div>
    </a>`;
  const ordered = upcoming.concat(past);
  return `<div class="view"><div class="wrap-wide"><section class="section">
    <div class="section-head"><div><h1>Events</h1></div></div>
    <div class="grid events">${ordered.map(cardOf).join('')}</div>
  </section></div></div>`;
}

function viewEventDetail(id){
  const e = find('events', id);
  if(!e) return notFound();
  const p = DATA.picks && DATA.picks[e.id];
  const pick = p ? `<div class="ra-pick">
        <span class="lbl">RA Pick</span>
        <p class="blurb">${esc(p.blurb)}</p>
      </div>` : '';
  const tickets = (!e.past && e.ticket)
    ? `<div class="btn-row"><a class="btn" href="${esc(e.ticket)}" target="_blank" rel="noopener">${t('tickets')}</a></div>`
    : (e.past && e.ticket
        ? `<div class="btn-row"><span class="meta" style="align-self:center">${t('pastEvent')}</span><a class="btn ghost" href="${esc(e.ticket)}" target="_blank" rel="noopener">${t('viewRA')}</a></div>`
        : (e.past ? `<div class="meta">${t('pastEvent')}</div>` : ''));
  return `<div class="view"><div class="wrap"><section class="section">
    <a class="back" href="#/events">← Events</a>
    <div class="detail">
      <div class="media">${mediaImg(e.image, e.title, '3/4')}</div>
      <div class="info">
        <h1>${esc(e.title)}</h1>
        <div class="sub">${esc(e.city)} · ${esc(e.date)}</div>
        <dl>
          <dt>${t('date')}</dt><dd>${esc(e.date)}</dd>
          <dt>${t('city')}</dt><dd>${esc(e.city)}</dd>
          <dt>${t('venue')}</dt><dd>${esc(e.venue)}</dd>
          <dt>${t('lineup')}</dt><dd>${e.lineup.map(esc).join(' · ')}</dd>
        </dl>
        ${pick}
        <div class="copy">${esc(e.summary)}</div>
        ${tickets}
      </div>
    </div>
  </section></div></div>`;
}

function viewMixes(){
  const cardOf = m => `
    <a class="mixtile" href="#/mixes/${esc(m.id)}" title="${esc(m.title)} — ${esc(m.artist)}">
      ${m.cover?`<img src="${esc(m.cover)}" alt="${esc(m.title)}" loading="lazy">`:`<div class="ph"><span>${esc(m.title)}</span></div>`}
      <div class="cap"><span class="mt">${esc(m.title)}</span><span class="ma">${esc(m.artist)}</span></div>
    </a>`;
  const list = (mixCat === 'live') ? (DATA.livesets||[]) : DATA.mixes;
  const cat = (key,label)=>`<span class="mix-cat ${mixCat===key?'on':''}" onclick="setMixCat('${key}')">${label}</span>`;
  return `<div class="view">
    <div class="wrap"><section class="section" style="min-height:0;padding-bottom:clamp(16px,3vw,26px)">
      <div class="section-head"><div><h1>Mixes</h1></div>
        <a class="btn ghost" href="${esc(DATA.site.soundcloud)}" target="_blank" rel="noopener">SoundCloud ↗</a></div>

}

    ? `<span class="kicker" style="margin-top:6px">${t('tracklist')}</span>
       <div class="tracklist">${r.tracklist.map((tk,i)=>`<div class="tr"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(tk)}</span></div>`).join('')}</div>`

/* Banda azul en movimiento con el logo de Tombolo (se usa en About) */
function marqueeHTML(){
  const MARK = `<svg class="mq-logo" viewBox="0 0 200 150" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M30 92 C24 84 30 76 40 80 C48 50 86 42 104 62 C116 74 110 96 92 96"/><path d="M90 94 C84 104 74 106 72 112"/><circle cx="60" cy="112" r="16"/><path d="M92 96 C104 48 152 46 172 76 C186 98 168 118 146 110 C150 126 156 138 170 148"/><circle cx="66" cy="72" r="12" fill="currentColor" stroke="none"/><circle cx="130" cy="82" r="12" fill="currentColor" stroke="none"/><circle cx="70" cy="74" r="3.6" fill="#1E2DFF" stroke="none"/><circle cx="134" cy="84" r="3.6" fill="#1E2DFF" stroke="none"/></svg>`;
  const unit = t('marquee').map(x=>`${MARK}<span>${esc(x)}</span>`).join('');
  const ticker = unit.repeat(6);
  return `<div class="marquee"><div>${ticker}${ticker}</div></div>`;
}

function notFound(){
  return `<div class="view"><div class="wrap"><section class="section">
    <div class="section-head"><h1>404</h1></div>
    <div class="empty">${t('nf1')} <a href="#/" style="color:var(--accent)">${t('nf2')}</a></div>
  </section></div></div>`;
}

/* =========================== ROUTER =========================== */
function router(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [section, id] = hash.split('/');

  // Pinta la web con el color de la sección activa
  document.documentElement.style.setProperty('--accent', THEME[section] ?? THEME['']);

  let html, active = section || '';
  switch(section){
    case '':        location.hash = '#/events'; return;   // sin landing: entra en Events
    case 'events':  html = id ? viewEventDetail(id) : viewEvents(); break;
    case 'mixes':   html = id ? viewMixDetail(id)   : viewMixes();  break;
    case 'label':   html = id ? viewLabelDetail(id) : viewLabel();  break;
    case 'shop':    location.hash = '#/'; return;  // Shop retirado: redirige a la home
    case 'about':   html = viewAbout(); break;
    default:        html = notFound(); active='';
  }
  $app.innerHTML = html;
  renderDoodles(active || 'home');
  window.scrollTo(0,0);

  document.querySelectorAll('.nav-links a').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('href') === '#/'+active);
  });
  document.getElementById('navLinks').classList.remove('open');
  setLangUI();
}

/* Refleja el idioma activo en el botón ES/EN y en <html lang> */
function setLangUI(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('#langToggle span[data-l]').forEach(sp=>{
    sp.classList.toggle('on', sp.getAttribute('data-l') === LANG);
  });
}

/* ===== Parallax del muro de la home: cada columna se mueve a su ritmo ===== */
let _pxTick = false;
function homeParallax(){
  _pxTick = false;
  const cols = document.querySelectorAll('.g-col');
  if(!cols.length) return;
  const y = window.scrollY;
  cols.forEach(c=>{
    const s = parseFloat(c.getAttribute('data-speed')) || 0;
    c.style.transform = s ? `translate3d(0,${(-y*s).toFixed(1)}px,0)` : '';
  });
}
const _reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================== ARRANQUE =========================== */
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', ()=>{
  if(!_reduceMotion){
    window.addEventListener('scroll', ()=>{ if(!_pxTick){ _pxTick=true; requestAnimationFrame(homeParallax); } }, {passive:true});
  }
  document.getElementById('year').textContent = '2018–2026';
  const s = DATA.site;
  document.getElementById('footLinks').innerHTML = [
    s.soundcloud && `<a href="${s.soundcloud}" target="_blank" rel="noopener">SoundCloud</a>`,
    s.instagram  && `<a href="${s.instagram}" target="_blank" rel="noopener">Instagram</a>`,
    s.bandcamp   && `<a href="${s.bandcamp}" target="_blank" rel="noopener">Bandcamp</a>`,
    s.facebook   && `<a href="${s.facebook}" target="_blank" rel="noopener">Facebook</a>`,
    s.email      && `<a href="mailto:${s.email}">Email</a>`,
  ].filter(Boolean).join('');
  document.getElementById('menuBtn').addEventListener('click', ()=>{
    document.getElementById('navLinks').classList.toggle('open');
  });
  router();
});
</script>
