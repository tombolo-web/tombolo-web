<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMBOLO — Electronic music promoter · label · mixes · Madrid</title>
<meta name="description" content="Tombolo — promotora de música electrónica, sello discográfico y mixes. Madrid desde 2018.">

<!-- ============================================================= -->
<!--  Tipografía:                                                  -->
<!--   · Space Grotesk → títulos grandes (con carácter)            -->
<!--   · Space Mono    → etiquetas, metadatos, formato "archivo"   -->
<!--  Se cargan de Google Fonts; sin internet caen a fuentes del   -->
<!--  sistema automáticamente.                                     -->
<!-- ============================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   PALETA Y VARIABLES  ·  edítalas aquí si quieres cambiar el look
   El color de acento (--accent) CAMBIA POR SECCIÓN automáticamente
   (ver el objeto THEME en el script de abajo).
   =================================================================== */
:root{
  --paper:    #ffffff;   /* fondo blanco                  */
  --paper-2:  #ffffff;   /* fondo de tarjetas (blanco)    */
  --ink:      #121212;   /* tinta principal (texto)       */
  --ink-dim:  #6a675f;   /* texto secundario / metadatos  */
  --line:     #121212;   /* líneas / bordes (negro fuerte)*/
  --accent:   #1E2DFF;   /* acento por defecto (azul Klein) — lo sobreescribe cada sección */
  --accent-ink:#ffffff;  /* texto sobre el acento         */
  --maxw:     1320px;
  --gap:      clamp(14px, 2.4vw, 26px);
  --shadow:   5px 5px 0 var(--ink);  /* sombra dura "pegatina" */
}

/* ===================================================================
   RESET / BASE
   =================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Space Mono', ui-monospace, 'SFMono-Regular', 'Consolas', monospace;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,.display{font-family:'Space Grotesk', ui-sans-serif, system-ui, sans-serif}
::selection{background:var(--accent);color:var(--accent-ink)}

*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-thumb{background:var(--ink)}
*::-webkit-scrollbar-track{background:var(--paper)}

/* ===================================================================
   NAVEGACIÓN PERSISTENTE
   =================================================================== */
header.nav{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
.nav-inner{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,40px);
  height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand .dot{width:12px;height:12px;background:var(--accent);border-radius:50%;display:inline-block;transition:transform .3s,background .3s}
.brand:hover .dot{transform:scale(1.5) rotate(20deg)}
.nav-right{display:flex;align-items:center;gap:clamp(10px,1.8vw,20px)}
.nav-links{display:flex;gap:clamp(8px,1.6vw,22px);align-items:center}
.lang-toggle{display:flex;align-items:center;gap:4px;font-family:'Space Mono';font-size:12px;font-weight:700;
  letter-spacing:.06em;border:2px solid var(--ink);padding:5px 9px;background:var(--paper-2)}
.lang-toggle span[data-l]{color:var(--ink-dim);transition:color .15s}
.lang-toggle span[data-l].on{color:var(--accent)}
.lang-toggle .sep{color:var(--ink-dim)}
.nav-links a{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px;
  border-bottom:3px solid transparent;transition:color .15s,border-color .15s,transform .15s;color:var(--ink)}
.nav-links a:hover{color:var(--accent);transform:translateY(-2px)}
.nav-links a.active{color:var(--ink);border-color:var(--accent)}
.menu-btn{display:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);padding:6px 12px;background:var(--paper-2)}

@media (max-width:780px){
  .menu-btn{display:block}
  .nav-links{position:absolute;top:62px;left:0;right:0;background:var(--paper);border-bottom:2px solid var(--ink);
    flex-direction:column;align-items:stretch;gap:0;max-height:0;overflow:hidden;transition:max-height .28s ease}
  .nav-links.open{max-height:360px}
  .nav-links a{padding:15px clamp(16px,4vw,40px);border-bottom:1px solid var(--ink)}
  .nav-links a.active{border-color:var(--ink);color:var(--accent)}
}

/* ===================================================================
   SECCIONES
   =================================================================== */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.wrap-wide{max-width:1560px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.section{padding:clamp(26px,5vw,58px) 0;min-height:62vh}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin-bottom:clamp(22px,4vw,42px);flex-wrap:wrap}
.section-head h1{font-size:clamp(34px,8vw,84px);font-weight:700;letter-spacing:-.03em;line-height:.9}
.section-head .meta{font-size:12px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase}
.kicker{display:inline-block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  background:var(--accent);color:var(--accent-ink);padding:5px 11px;margin-bottom:14px;transform:rotate(-1.5deg)}

/* ===================================================================
   HOME
   =================================================================== */
.hero{padding:clamp(34px,7vw,84px) 0 clamp(20px,4vw,40px)}
.hero-logo{font-family:'Space Grotesk';font-weight:700;font-size:clamp(58px,17vw,190px);line-height:.8;letter-spacing:-.045em}
.hero-logo .b{color:var(--accent);transition:color .3s}
.hero-tag{font-family:'Space Grotesk';font-weight:500;font-size:clamp(19px,3.4vw,40px);line-height:1.05;
  letter-spacing:-.01em;margin-top:.35em}
.hero-tag em{font-style:normal;color:var(--accent);white-space:nowrap}
.hero p.lead{max-width:60ch;margin-top:clamp(20px,3vw,30px);font-size:clamp(14px,1.6vw,17px);line-height:1.7}

/* Home intro compacto (sobre el muro de galería) */
.home-intro{padding:clamp(30px,6vw,70px) 0 clamp(20px,3vw,34px)}
.home-intro .hero-tag{max-width:24ch}
.home-intro .lead{max-width:56ch;margin-top:clamp(16px,2.4vw,24px);font-size:clamp(14px,1.6vw,17px);line-height:1.7}

/* Muro de galería (fotos + dibujos) estilo Public Records */
.gallery-wall{display:flex;align-items:flex-start;gap:var(--gap);padding-bottom:clamp(30px,6vw,80px);overflow:hidden}
.g-col{flex:1;display:flex;flex-direction:column;gap:var(--gap);will-change:transform}
.g-item{}
.g-photo{border:2px solid var(--ink);background:var(--paper-2);overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease}
.g-photo:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow)}
.g-photo img{width:100%;height:auto;display:block}
.g-drawing{padding:6px}
.g-drawing img{width:100%;height:auto;display:block;filter:drop-shadow(3px 3px 0 rgba(18,18,18,.15))}
.g-drawing .ph{background:none;border:2px dashed var(--ink)}
.g-item .ph{height:auto}
.g-item .ph span{font-size:11px}
.marquee{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);overflow:hidden;white-space:nowrap;
  background:#1E2DFF;color:#fff;margin-top:clamp(28px,5vw,56px)}
.marquee div{display:inline-block;padding:11px 0;animation:scroll 26s linear infinite;font-family:'Space Grotesk';
  font-weight:700;font-size:18px;letter-spacing:.02em}
.marquee span{padding:0 22px;vertical-align:middle}
.marquee .mq-logo{display:inline-block;height:22px;width:auto;vertical-align:middle;margin:0 6px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Índice de secciones */
.index-list{border-top:2px solid var(--ink);margin-top:clamp(26px,5vw,52px)}
.index-row{display:grid;grid-template-columns:54px 1fr auto;gap:18px;align-items:center;
  padding:clamp(16px,3vw,26px) 6px;border-bottom:2px solid var(--ink);transition:padding-left .2s,background .2s,color .2s}
.index-row:hover{background:var(--accent);color:var(--accent-ink);padding-left:18px}
.index-row .num{font-size:13px;opacity:.7}
.index-row .ttl{font-family:'Space Grotesk';font-size:clamp(24px,4.4vw,44px);font-weight:700;letter-spacing:-.02em}
.index-row .arr{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.index-row .desc{grid-column:2;font-size:12.5px;margin-top:3px;opacity:.75}

/* ===================================================================
   GRIDS
   =================================================================== */
.grid{display:grid;gap:var(--gap)}
.grid.events{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap);align-items:flex-start}
.grid.events > .card{flex:0 0 268px}
@media(max-width:560px){.grid.events > .card{flex:1 1 calc(50% - 8px)}}
/* nivelar tarjetas: título a 2 líneas fijas y sala sin saltar de línea */
.grid.events .card .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.36em}
.grid.events .card .row > span:not(.badge){min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.label {grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.grid.mixes{grid-template-columns:repeat(6,1fr);gap:clamp(8px,0.9vw,14px);padding:0 clamp(16px,4vw,40px)}
@media(max-width:1100px){.grid.mixes{grid-template-columns:repeat(4,1fr)}}
@media(max-width:720px){.grid.mixes{grid-template-columns:repeat(3,1fr)}}
@media(max-width:460px){.grid.mixes{grid-template-columns:repeat(2,1fr)}}
.grid.shop  {grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}

.card{display:block;cursor:pointer;background:var(--paper-2);border:2px solid var(--ink);
  transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:var(--shadow)}
.card .art{aspect-ratio:1/1;width:100%;overflow:hidden;background:var(--paper);border-bottom:2px solid var(--ink);position:relative}
.card.poster .art{aspect-ratio:5/7}
.card .art img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
/* variante "contain": caja fija (3:4 con .poster) y flyer ENTERO centrado, sin recortar */
.card .art.contain img{object-fit:contain}
.card:hover .art img{transform:scale(1.04)}
.card .body{padding:13px 14px 16px}
.card .t{font-family:'Space Grotesk';font-size:16px;font-weight:700;line-height:1.18}
.card .s{font-size:12.5px;color:var(--ink-dim);margin-top:5px}
.card .row{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:11.5px;color:var(--ink-dim);align-items:center}
.card .price{color:var(--accent);font-weight:700;font-size:14px}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);padding:3px 7px}
.sold{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--paper);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;transform:rotate(-4deg)}

/* ===================================================================
   MIXES  ·  galería de portadas (estilo Butter Sessions)
   =================================================================== */
.mixtile{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;background:var(--paper);cursor:pointer}
.mixtile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.mixtile:hover img{transform:scale(1.06)}
.mixtile .ph{position:absolute;inset:0}
.mixtile .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 11px;color:#fff;
  background:linear-gradient(to top,rgba(12,12,12,.92),rgba(12,12,12,0));
  opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}
.mixtile:hover .cap{opacity:1;transform:none}
.mixtile .cap .mt{display:block;font-family:'Space Grotesk';font-weight:700;font-size:14px;line-height:1.15}
.mixtile .cap .ma{display:block;font-size:11.5px;opacity:.85;margin-top:2px}
@media (hover:none){ .mixtile .cap{opacity:1;transform:none;background:linear-gradient(to top,rgba(12,12,12,.85),rgba(12,12,12,0))} }
/* Conmutador de categorías (TOMBOLOMIXX / LIVE RECORDINGS), centrado bajo el título */
.mix-cats{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:10px;
  margin:clamp(16px,3vw,28px) 0 0;
  font-family:'Space Grotesk';font-weight:700;letter-spacing:-.01em;line-height:1}
.mix-cats .mix-cat,.mix-cats .mix-sep{font-size:clamp(18px,2.6vw,32px)}
.mix-cats .mix-cat{cursor:pointer;color:var(--ink-dim);transition:color .15s}
.mix-cats .mix-cat.on{color:var(--ink)}
.mix-cats .mix-cat:hover{color:var(--accent)}
.mix-cats .mix-sep{color:var(--ink-dim)}

/* ===================================================================
   FICHA / DETALLE
   =================================================================== */
.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:start}
@media (max-width:840px){.detail{grid-template-columns:1fr}}
.detail .media{border:2px solid var(--ink);background:var(--paper);overflow:hidden;box-shadow:var(--shadow)}
.detail .media img{width:100%;height:auto}
.detail .info h1{font-size:clamp(28px,5vw,52px);line-height:.95;margin-bottom:8px;letter-spacing:-.02em}
.detail .info .sub{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:4px 10px;font-size:13px;margin-bottom:24px;transform:rotate(-1deg)}
.detail dl{display:grid;grid-template-columns:120px 1fr;gap:11px 16px;border-top:2px solid var(--ink);padding-top:18px;margin-bottom:22px}
.detail dt{color:var(--ink-dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.detail dd{font-size:14px}
.detail .copy{font-size:14.5px;line-height:1.75;white-space:pre-line;margin-bottom:24px}
.detail .copy.dim{color:var(--ink-dim)}
/* RA Pick — reseña editorial de Resident Advisor */
.ra-pick{border-top:2px solid var(--ink);margin:6px 0 24px;padding-top:16px}
.ra-pick .lbl{display:inline-block;font-family:'Space Mono';font-weight:700;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:#ff2a1a;margin-bottom:12px}
.ra-pick .blurb{font-family:'Space Grotesk';font-weight:500;font-size:clamp(16px,1.9vw,21px);line-height:1.4;margin:0 0 14px}
.ra-pick .by{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-dim)}
.ra-pick .by .av{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-dim);flex:none;
  background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--ink-dim) 3px,var(--ink-dim) 4px)}
.tracklist{border-top:2px solid var(--ink);margin-top:8px}
.tracklist .tr{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:9px 2px;border-bottom:1px solid var(--ink);font-size:13.5px}
.tracklist .tr .n{color:var(--ink-dim)}

.btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:var(--accent-ink);
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:13px 22px;
  border:2px solid var(--ink);border-radius:40px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.btn.ghost{background:var(--paper-2);color:var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:24px;border-bottom:2px solid transparent}
.back:hover{color:var(--accent);border-color:var(--accent)}

.sc-embed{margin-top:10px;border:2px solid var(--ink)}
.sc-embed iframe{display:block;width:100%}

/* ===================================================================
   ABOUT
   =================================================================== */
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(28px,6vw,68px);align-items:start}
@media (max-width:840px){.about{grid-template-columns:1fr}}
.about .prose p{margin-bottom:18px;font-size:15.5px;line-height:1.8;max-width:64ch}
.about .prose p:first-child{font-family:'Space Grotesk';font-size:clamp(20px,2.6vw,28px);line-height:1.4;font-weight:500}
.contact-block{border:2px solid var(--ink);background:var(--paper-2);padding:clamp(20px,3vw,28px);box-shadow:var(--shadow)}
@media(min-width:841px){.about .contact-block{margin-top:clamp(-92px,-5vw,-48px)}}
.contact-block h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:14px}
.contact-block a.line{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ink);font-size:14px}
.contact-block a.line:last-child{border-bottom:none}
.contact-block a.line:hover{color:var(--accent)}
.contact-block a.line .ico{width:22px;height:22px;flex:none;color:var(--ink)}
.contact-block a.line:hover .ico{color:var(--accent)}
.contact-block a.line .ico svg{width:100%;height:100%;fill:currentColor}

/* Doodles parpadeantes en las esquinas del About */
.about-section{position:relative}
.about-doodle{position:absolute;width:clamp(96px,12vw,180px);height:auto;pointer-events:none;z-index:3;
  mix-blend-mode:multiply;animation:doodleBlink 1.6s steps(1,end) infinite}
.about-doodle.d-bird{top:6px;right:1%}
.about-doodle.d-dj{bottom:6px;left:1%;animation-duration:2.1s;animation-delay:.45s}
@keyframes doodleBlink{0%,72%{opacity:1}73%,100%{opacity:0}}
@media(max-width:720px){.about-doodle{width:88px}}
@media(prefers-reduced-motion:reduce){.about-doodle{animation:none;opacity:1}}
/* ===================================================================
   PLACEHOLDER
   =================================================================== */
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;
  background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 12px,#ececec 12px,#ececec 24px);color:var(--ink-dim)}
.ph span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}

/* ===================================================================
   FOOTER
   =================================================================== */
footer.site{border-top:2px solid var(--ink);margin-top:60px;padding:clamp(30px,5vw,52px) 0;background:var(--paper)}
.foot-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
.foot-grid .big{font-family:'Space Grotesk';font-size:clamp(34px,8vw,88px);font-weight:700;letter-spacing:-.03em;line-height:.9}
.foot-grid .links{display:flex;gap:14px;flex-wrap:wrap}
.foot-grid .links a{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid transparent}
.foot-grid .links a:hover{color:var(--accent);border-color:var(--accent)}
.foot-legal{margin-top:30px;font-size:11.5px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{color:var(--ink-dim);padding:40px 0;text-align:center;border:2px dashed var(--ink)}

/* ===================================================================
   DIBUJOS DISPERSOS ("doodles")  ·  aparecen de forma espontánea.
   Son decorativos: no bloquean clics. Su contenido se edita en el
   array DATA.doodles (más abajo).
   =================================================================== */
#app{position:relative}
.doodle-layer{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.doodle{position:absolute;display:block;opacity:0;transform-origin:center;
  animation:doodlePop .55s cubic-bezier(.2,1.4,.4,1) forwards, doodleFloat 7s ease-in-out infinite}
.doodle img,.doodle svg{width:100%;height:auto;display:block;filter:drop-shadow(2px 3px 0 rgba(18,18,18,.18))}
@keyframes doodlePop{from{opacity:0;transform:scale(.2) rotate(var(--rot)) translateY(10px)}
  to{opacity:1;transform:scale(1) rotate(var(--rot))}}
@keyframes doodleFloat{0%,100%{translate:0 0}50%{translate:0 -9px}}
@media (max-width:680px){.doodle.hide-mobile{display:none}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<!-- ===================================================================
     NAVEGACIÓN PERSISTENTE
     =================================================================== -->
<header class="nav">
  <div class="nav-inner">
    <a href="#/" class="brand" aria-label="Tombolo home"><span class="dot"></span>Tombolo</a>
    <div class="nav-right">
      <nav class="nav-links" id="navLinks">
        <a href="#/events">Events</a>
        <a href="#/mixes">Mixes</a>
        <a href="#/label">Label</a>
        <a href="#/about">About</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">Menu</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="site">

  /* ---------------------------------------------------------------
     3) MIXES (SoundCloud)
        Cómo obtener "scUrl":
          1. Abre el mix en soundcloud.com/tombololive
          2. Copia la URL pública del track (la de la barra del navegador)
          3. Pégala en "scUrl". El reproductor se incrusta solo.
        Campos:
          id, title, artist, date, duration, genre
          cover : portada cuadrada (1:1). "" = placeholder
          scUrl : URL del track en SoundCloud (para el reproductor)
          notes : descripción que se ve en la ficha del mix
     --------------------------------------------------------------- */
  mixes: [
    { id:"mix-160", title:"TOMBOLOMIXX 160", artist:"Cris Sinaka", date:"2026", duration:"1:01:09", genre:"", cover:"https://i1.sndcdn.com/artworks-u8XwHrEgd7Alm37D-WISdZw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/crisinaka", notes:"Yay!\n\nSuper stoked to welcome this incredible dj to the series!\n\n Cris Sinaka, is a talented selector from Vigo (Galicia) that currently lives in Madrid. Sounds from Outter Space, infinite breaks sSsurfing through elegant melodies, this and more is what you can expect on any of her sets. A superb and fresh not only curation but technical skill on the mixer.  A usual in clubs like Cadavra do not miss her out if you're ever in the city for pleasure... or business.\n\n@cris_sinaka" },
    { id:"mix-159", title:"TOMBOLOMIXX 159", artist:"Elio", date:"2026", duration:"1:18:56", genre:"Downtempo", cover:"https://i1.sndcdn.com/artworks-7i4SJecO9BNCDk3I-RCnAUw-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-159-elio", notes:"Ok back on the mixes!!\n\nHappy to welcome again a brother from another mother, snowboard superstar, fantasy camp CEO, and the absolute boss of many other cool things.... ELIO!!\n\nOver an hour of downtempo jams straight from his secret stash, this guy never misses and has a delighful taste when it comes to dig and select music. Do not miss!! ****\n\n@elio-fumagalli" },
    { id:"mix-158", title:"TOMBOLOMIXX 158", artist:"Nachine", date:"2026", duration:"1:05:23", genre:"Deep House", cover:"https://i1.sndcdn.com/artworks-Zc1wNWUUK4algbBo-tJlPow-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-158-nachine", notes:"A special character amongst characters, a true soul in the dancefloor, some people think of him as a myth, some of them never saw his face.... Nachine is all about enjoying music and community. \n\nShowcasing 65 minutes of slow sexy deep dubby beats to make your journey lighter, don't miss the opportunity to dive into this mix, and leave for a moment this world full of fast paced music where one tends to forget that a party always should start....easy....and nice.\n\nThank you Nacho B-)\n@ignacio-torre-cuesta" },
    { id:"mix-157", title:"TOMBOLOMIXX 157", artist:"emkay", date:"2026", duration:"1:00:48", genre:"", cover:"https://i1.sndcdn.com/artworks-tLgBfyLzYPr5i9OI-5UDkfQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/emkay", notes:"Woohooooo!\n\nSo stoked to be hosting funktastik @emkaybymk aka Maria Korkeila aka The Queen of Finland for the second time! A helsinki based incredly talnted designer, DJ and producer. Korkeila plays regularly at Helsinki's club scene, from @postbar-solstice to Club Kaiku and Stidilä, in addition to which she hosts a monthly radio show on @Ida_Radio where she explores house, trance, or techno music from many perspectives. \n\nShe releases music kind of everywhere, but do not miss out her last release as 1/3 of Trickpony on @stepballchain with talented @roza-terenzi and @mikemidnight.\n\nHere's one hour of insanely well selected  party gems to make your week easier." },
    { id:"mix-156", title:"TOMBOLOMIXX 156", artist:"Tiago", date:"2026", duration:"1:02:38", genre:"", cover:"https://i1.sndcdn.com/artworks-ca8hstu4FHFE0OAJ-Zbb5uQ-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-156-tiago", notes:"Hailing from Lisbon where he is a weekly resident at Club Lux, Tiago has a laid back intensity that is reflected in the expansive and inquisitive nature of his sets. Raised on good music in his home, turned on to drumming by his older brother, he came to Dj'ing via live music. He has been at it for close to twenty years, and in the last decade added production work to his resume traveling the whole world.\n\nA beautiful one hour trippy mix, made to explore sound from a different perspective.\n\n@simatudo" },
    { id:"mix-155", title:"TOMBOLOMIXX 155", artist:"Grosera", date:"2026", duration:"1:01:26", genre:"", cover:"https://i1.sndcdn.com/artworks-gZGW68oB9ULACOlq-H2DPpQ-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-155-grosera", notes:"Okkkkayy!!\n\nIntroducing Grosera, a rising star on the global electronic circuit that has brought her distinctive sound to clubs across Europe, Latin America, the U.S., and Asia—including Watergate (Berlin), Faust (Seoul), and OIL Club (Shenzhen). She is now based in Barcelona, but was a resident at Bogotá’s iconic Video Club, her sets flow through percussive techno, progressive house, trance-laced atmospheres, and futuristic textures—grounded by a precise, playful take on Latin-inflected rhythms.\n\n@Grosera" },
    { id:"mix-154", title:"TOMBOLOMIXX 154", artist:"Damian Schwartz", date:"2026", duration:"1:58:56", genre:"", cover:"https://i1.sndcdn.com/artworks-3Pcexo97IREO9UB0-hRrbtg-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-154-damian-schwartz", notes:"Introducing one of Madrid’s finests: Damián Schwartz\n\nBeyond his work as mastering engineer for our releases, Damián has maintained a sustained presence in underground electronic music since the early 2000s. His trajectory has taken him from Sónar to Panorama Bar and across international circuits, building a reputation as both a producer and selector whose music has found its way into sets by some of your favorite DJs.\n\nWith releases on labels like Apnea, Semantica, Oslo Records and his own AHD imprint, his productions move fluidly between house, techno, ambient and more experimental zones—always prioritizing groove and narrative over formula. As a DJ, his approach follows the same principle: sets guided by musical intuition rather than adherence to any single style.\n\nThis two-hour mix, recorded live during one of the Alimentación Ming Zhu parties, captures that sensibility—hypnotic house, mental techno and introspective passages blended with care and intention.\n@damianschwartz" },
    { id:"mix-153", title:"TOMBOLOMIXX 153", artist:"eoin dj  (live at tombolo club)", date:"2025", duration:"1:33:30", genre:"", cover:"https://i1.sndcdn.com/artworks-d4CBRpJ8bfoR1yRV-KWImvQ-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-153-eoin-dj", notes:"@eoindj made us sweat for over 2 hours in our last party. Catch a glimpse of what was one of the sickest sets we've ever recorded." },
    { id:"mix-152", title:"TOMBOLOMIXX 152", artist:"DJ SRA", date:"2025", duration:"1:12:29", genre:"Deep House", cover:"https://i1.sndcdn.com/artworks-KCkukiMtEbic0egL-xnbAaw-t500x500.png", scUrl:"https://soundcloud.com/tombololive/djsra", notes:"yeeeeheeewww!\n\nIntroducing funktastik DJ SRA to the series, an artist from Arhus, Denmark bringingggg the heat with 1 hour and 12 minutes of pure deep house jams, vinyl only! Do not sleep on this one!!\n\n@discsra" },
    { id:"mix-151", title:"TOMBOLOMIXX 151", artist:"beltranz", date:"2025", duration:"55:51", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-ixc5Y3UOSuSzEiky-T02HSA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-151-beltranz", notes:"@beltranz weaves his sets between old school rhythms, warm atmospheres, and progressive grooves that balance intensity and melancholy. His sound unfolds like a rhythmic yet ethereal journey, nostalgic yet open to evolution, created for dance floors that value connection, freedom, and collective energy.\n\nEach session is an exploration that connects body and emotion, past and present, with a sound narrative that flows without labels and transforms the dance floor into a space of communion and shared movement.\n\nAs part of the @Mixthetika collective, a benchmark in the Basque Country for its commitment to diversity as well as the creation of inclusive spaces for the LGBTIQ+ community, beltranz channels that collective energy into an honest, changing, and deeply human proposal." },
    { id:"mix-150", title:"TOMBOLOMIXX 150", artist:"Bat", date:"2025", duration:"2:10:37", genre:"Sonic", cover:"https://i1.sndcdn.com/artworks-TOAInzfLTECV9juP-lZePgw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-150-bat", notes:"Tombolomixx makes 150!\n\nAbsolutely stoked to host such a special edition with the very talented and raising star Rachael aka Bat. Growing up in the suburbs close to the mythical city of Detroit, Madrid based Bat is a selector who maneuvers through music with fluidity. Unwilling to restrict her sound to one note, her sets bounce between the boundaries of genres. Generally her mixes are eclectic yet dynamic, filled with sounds from the past, yet contemporary. From her hometown, Bat brings the influences of Midwestern techno and electro from the 90s. Her exposure to the broken rhythms of dubstep, jungle and drum n bass have enticed her to step outside of conventional club compositions.\n\n\n\n\nBat persistently seeks to excite the dance floor through disparate sounds, driving rhythms, colorful synths and clashing breaks. She has played in clubs in cities such as Barcelona, Amsterdam, Berlin, and San Sebastían (Dabadaba.) Above all else, her primary desire is for the audience to move with her, stimulated by her sonic selection.\n\nChanneling Perlon vibesSs....\n\n@batmandel" },
    { id:"mix-149", title:"TOMBOLOMIXX 149", artist:"Blend Affect", date:"2025", duration:"1:00:31", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-fXnRESBT8S9NecNo-yEb0vQ-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-149-blend-affect", notes:"Blend Affect (formerly known as La Diabla) is a DJ and musical artist whose career spans from the warm lands of Gran Canaria to the vibrant cultural scene of Barcelona.\n\nThroughout his career, he has taken his sound to international stages, performing in New York, Switzerland, Norway, Portugal, and other cities around the world. On the national circuit, he has made his mark with performances at renowned events such as the Sónar Festival in Barcelona, Boiler Room, Keep Hush, and Primavera Sound a la Ciutat.\n\n Blend Affect navigates genres with ease, loving to dig and find the perfect track for every occasion. His sets are a rollercoaster of grooves, percussion, and catchy rhythms, skillfully selected and performed with infectious energy.\n\nENJOY!\n\n@blendaffect" },
    { id:"mix-148", title:"TOMBOLOMIXX 148", artist:"Tierno Cartilago b2b Afferent", date:"2025", duration:"2:11:21", genre:"Breakbeat", cover:"https://i1.sndcdn.com/artworks-0WN88N7KNXk2OHyP-0JKwqw-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-148-tierno-cartilago-b2b-afferent", notes:"For breakbeat lovers, coming from the spanish breakbeat Mecca aka Sevilla we introduce these two fantastic djs Tierno Cartilago (@djtiernocartilago) and Afferent (@antoniomateos). \n\nHere they present this hellish recorded DJ set from their party at Sabotaje Club, warming up for electro pioneer Dark Vector. Expect over two hours of pure breaking beat madness, so make sure your shoes are properly tied up and that you are wearing some sport clothes while listening to it." },
    { id:"mix-147", title:"TOMBOLOMIXX 147", artist:"CVLT", date:"2025", duration:"58:55", genre:"Skizzo", cover:"https://i1.sndcdn.com/artworks-RpcDsyR8kWgjBlzU-y039JQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-147-cvlt", notes:"Such a pleasure to welcome Nicolai Sarbib aka CVLT (@cvlt-1) to the series! A man that was born in the UK and brought up between Lisbon and Porto in the heart of a family of jazz musicians. He is an avid collector and started playing music at an early age, what took him, through a lot of work to be one of the established figures from his hometown. Always in a quest to explore different sounds, he started the legendary \"No Idols\" party at Lounge club (Lisbon), where during the course of 12 years, he brought over 50 artists from Hashman Deejay to Joe Delon.\n\nIn this 1h mix he portrays some of his fantastic trippiness taking you on a voyage that you'd surely won't forget. \n\nPlease make sure you do not miss him in our next party on the 10th of October amongst other fantastic artists. Tickets link in bio" },
    { id:"mix-146", title:"TOMBOLOMIXX 146", artist:"AJ aka Ethan Morgan", date:"2025", duration:"1:32:05", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-9eNz5vN1h39j3otR-Qn9baA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-147-ethan-morgan", notes:"yeah bwoiiiii!\n\nIntroducing absolute boss AJ aka Ethan Morgan to the series. This man of adventure and mystery is a torrrnado. Born in Okinawa, Japan, Ethan is a pro snowboarder that resides in Austria where he travels from to shred and destroy everything he finds in his path. He is an avid record collector and eclectic dj, playing all kinds of good stuff, from hip hop jams, to hardstyle, breaks, 90's house and more *. DO NOT SLEEP ON THIS ONEEE!!!!!!\n\nEnjoy!\n\n@ajmorganfreemanson" },
    { id:"mix-145", title:"TOMBOLOMIXX 145", artist:"Arlanoa", date:"2025", duration:"1:25:16", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-RdOugvjYnMOeVsuw-xpznOA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-145-arlanoa", notes:"Yayyyy!\n\nSúper pumped to welcome to the series raising star Arthur aka Arlanoa!! Being part of the shiny Berlin’s collectif Supertonic, you will find him always bringing you the best quality of his record collection ! Expect rare house grooves, cheeky breaks, infused with different ravey and 90’s prog sounds. Top tier!!!" },
    { id:"mix-144", title:"TOMBOLOMIXX 144", artist:"Lucient (Live at Embassa't 2025)", date:"2025", duration:"1:43:33", genre:"", cover:"https://i1.sndcdn.com/artworks-3kyHx9H2RoPe8ZRO-uUERjw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-143-lucient", notes:"Mario G. Quelart aka Lucient has been a fundamental and ubiquitous part of the Spanish electronic scene for years. Whether as a programmer, promoter, agent or simply as a cog that helps keep the wheel turning, he is one of the most valued people on the circuit, by both friends and professionals.\n\nWith over 20 years behind the decks, and in this time he has undoubtedly become one of the most talented artists in the country. His versatility and vision for the dance floor, together with his excellent technique make him an infallible DJ.\nLucient is a resident DJ at LAUT club in Barcelona and is part of the Lapsus family where, amongst other tasks, he is in charge of A&R for CEE, the club orientated sub-label.\n\nPlease enjoy his set at Embassat, a community festival in the heart of Barcelona, where he delivers almost 2h of intense techno beats, hypnotic 90s trance, acid breaks, house and more!\n\nFoto credit: Gisela Jané\n\nTracklist:\n01.- Pere Quart - Corrandes d'exili\n02.- Djrum - Waxcap - Under Tangled Silence		  \n03.- Carré - Soft Fascination (Priori Mechanical Dub) - Soft Fascination\n04.- Leftfield - Afro Ride - wipE'out'' 2097	\n05.- Soulmate - Drone - Drone\n06.- Emeka Ogboh - Intro - 6°30′33.372″N 3°22′0.66″E\n07.- Cozmo Giant - Obsession\n08.- Volte-Face - Blatchington Mill (Wata Igarashi's Stairway Remix) - Murmuration\n09.- massimo vivona - Isolation - massimo vivona 001\n10.- Russell E. L. Butler - Acorn - God Is Change\n11.- Marco Shuttle - The Vox Attitude - The Vox Attitude Remixes Vol.2\n12.- The 3rd Alternative - No Apologies (Part 1)\n13.- MIURA - I Do - Three Dots\n14.- H.E.I.M. Elektronik & MAS 2008 - Secret Scientists - Plastic Omnium\n15.- chemical brothers - electronic battle weapon 3 (under the influence) - electronic battle weapon 3 & 4\n16.- Hans Berg - Under The Roots - UFO012\n17.- Pete Lazonby - Sacred Cycles - Hypnotised A Journey Through British Trance Music (1993 - 2002)\n18.- Dj Steve - Azul Electrico - 'Secret Touch' EP\n19.- Rrose - The Surgeon General (No Child Left Behind) - The Surgeon General\n20.- S.O.N.S - Nite-Club - Drive\n21.- Desroi - Rasin - Azara\n22.- Fireground - Etereo - Love Letter	\n23.- Friends Of Matthew - Out There (Lange 12\") - Out There\n24.- Aquarian - Kool Ranch FM - Split 2\n25.- Ben Pest - 1996 - Worst Behaviour\n26.- Patrick Siech & Sandra Mosh - Square Side - Relicta - EP\n27.- Ragged Life - My Friend Is Taking Drugs (DJ Freud Vision) - Sunday\n28.- Locust - No-One in the World - Morning Light\n29.- Max romeo & the upsetters - chase the devil" },
    { id:"mix-143", title:"TOMBOLOMIXX 143", artist:"DJ One Go", date:"2025", duration:"45:34", genre:"", cover:"https://i1.sndcdn.com/artworks-jGjCUxplF9YQE7px-I9r92g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-144-dj-one-go", notes:"DJ One Go (pronounced Guango) is the alias of DJ and producer Manuel Printzen, originally from Guadalajara, Mexico.\n\nHe is the co-founder of the POAT, a platform dedicated to creating space for music and club culture with over 12 years of track record. In terms of musical genres, we can find mixes of Global Bass, Latin club, and breaks with more \"traditional\" rhythms like merengue, technobanda, salsa, and cumbia.\n\n1. DJ ONE GO - GUANGO FUNK\n2. FRAN G - EAST\n3. REGAL86 - GOLD WIRE (CRUIZIN MIX)\n4. DJ FUCCI, ERICK RINCÓN - QUERUBÍN\n5. DJ ONE GO - APRETÓN (D'NALGAS MIX)\n6. MITÚ - DANZAAA\n7. SKREAM - MIDNIGHT REQUESTLINE (Neumonic's Speedy G Bootleg)\n8. DANI WAIS - DO YOUR THING\n9. DJ ONE GO - DALE+DURO (1oo1o HARDER MIX)\n10. DJ ONE GO - DON PERIÑÓN\n11. DJ ONE GO - RITMO QUEBRADITO\n12. DJ ONE GO - TIBURÓN DE ASFALTO (PUERTO VALLARTA MIX)\n13. KING DOUDOU, STYN - TUTUTU\n14. FEID, YOUNG MIKO - CLASSY 101 (NEEIV EDIT)\n15. SUSOBRINO - SUSUSUSU\n16. 1oo1o - DEL SALSÓDROMO AL RAVE\n17. DJ ONE GO - TIRO AL BLANCO (TRIPLE 20 MIX)\n18. FRAN G - DUCATI & JORDANS\n19. DJ ONE GO - TORRENTE\n20. MJ NEBREDA, PACHEKO, PHRAN - ASÍ NACÍ\n21. DJ ONE GO - QUEBRADINHA\n22. MIDI KIND - TODO PASA (DJ ONE GO REMIX)\n23. DJ ONE GO - MAMBO EN EL LAMBO\n24. DJ ONE GO - RAPIÑA\n25. DJ ONE GO - PRESA\n26. SWEET ELECTRA - JAZZWEET" },
    { id:"mix-142", title:"TOMBOLOMIXX 142", artist:"Onkel-S", date:"2025", duration:"1:17:36", genre:"", cover:"https://i1.sndcdn.com/artworks-mLPbBxusvsux5AgO-3m9zOg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-142-onkel-s", notes:"Wahoooooo!\n\nIt's time to welcome this awaited mix from Norwegian OG and Former resident at The Level Party in New York, Onkel-S! A guy that has been digging in crates and warming up rooms since the days when phones had antennas. A longtime vinyl head with a soft spot for 90s house, his sets are all about vibe—warm, groovy, and built for the early part of the night when things are just getting interesting. Think low lights, clinking glasses, and the kind of tracks that make you nod before you even realize you’re dancing.\n\nThis 1 hour and 17 minutes set is a wonderful 100% vinyl trip accross multiple fun genres that will make your feet itchy. Enjoy!!\n\n@sverrewegge" },
    { id:"mix-141", title:"TOMBOLOMIXX 141", artist:"Gela (Live at Dabadaba)", date:"2025", duration:"2:06:20", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-QubXPYH6sACLtizo-RkcSsw-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-141-gela-live-at-dabadaba", notes:"Devourer of sounds, restless DJ and a unique voice in the scene of our country, Gela's musical journey began in Murcia in 2003. She hasn't stop traveling since then, constantly getting soaked in the musical influences of the different parts of the world she visited. No wonder why you can find infinite diverse influences as disco, cosmic funk, Brazilian music, acid house, dark 80s new wave, low bpm techno, electro, ambient and 90s breaks cohabiting in her sets.\n\nGela has expanded her range to numerous corners, stepping into the booths of Razzmatazz in Barcelona, Corsica Studios in London, Wilden Renate and About Blank in Berlin, Café Berlin in Madrid and Red Light Radio in Amsterdam, getting royalty slots in Sónar or opening for Laurent Garnier at Brunch-In The Park in Madrid. \n\nThis set is fantastic, made in the golden booth of Dabadaba in Donosti (North of Spain). Two hours of a blend of house, cosmic disco and new wave that will get your feet itchy!\n\n(@GELA)" },
    { id:"mix-140", title:"TOMBOLOMIXX 140", artist:"Kid Simius", date:"2025", duration:"1:01:12", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-qfCs2EG9isPYDGxY-aWK7LA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/kidsimius", notes:"Yaaaay!!\n\nSo happy to welcome legendary @kidsimius to the series. Born in Granada, Spain, and currently based in Berlin, KID SIMIUS circumvents genre limitations to embrace and merge a myriad styles. Delving into electronic music, Italo, House, Balearic, Disco and lots more, this is an artist who puts good energy and human connection above genre labels. He has released many successful tracks on Permanent Vacation, Running Back, Shall Not Fade, Studio Barnhus, Watergate Rec. and his label Jirafa Records (remixes and collaborations by Sofia Kourtesis, Paula Tape, Magit Cacoon, Gerd Janson, Echonomist, Paul Kalkbrenner) and co-wrote a platinum-certified chartbuster on the side, with Marteria‘s »Lila Wolken«.\n\nHis top 10 Spotify tracks already have a total of 30 million streams has appeared on legendary clubs and festival stages as diverse as Melt!, Tomorrowland, Sonar, Fusion, Blitz, Badaboum, Nitsa etc. Last year, the artist played over 30 festivals as Live Act and DJ in front of thousands of fans, where he was supporting WhoMadeWho, DJ Tennis, Kerri Chandler, Job Jobse, Bonobo and many more.\n\nPrepare yourself to shake ya booty over 1h to wonky fun rythms, house, breaks, rolling over cheeky vocals and trippy melodies!!" },
    { id:"mix-139", title:"TOMBOLOMIXX 139", artist:"DJ Sito (Live at Cadavra Club)", date:"2025", duration:"2:23:54", genre:"House", cover:"https://i1.sndcdn.com/artworks-zUFwSC3dLtW0YV43-ydmyLg-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-139-dj-sito-live-at-cdvr", notes:"DJ Sito (@elli-sito) is a dj with origins in Seattle and NYC who has been earning his spots in the dancefloors of Madrid for five years now. Sito has polished a personal style that mixes house, techno, breaks, acid and eclectic sounds, always with an energy that engages.   \n\nHe is the co-founder of @dddddj.club, and resident on @relativaradio with programs like @taka-taka-taka (along with @polita_______) and Sonido del Platz. \n\nThe 2h23 minutes mix is a live recording from a night at @cadavra.club a few months ago, playing between vinyl and digital. Get ready to immerse yourself in a set that captures vibrant beats, bold selections and a unique approach to music." },
    { id:"mix-138", title:"TOMBOLOMIXX 138", artist:"Bakläxa", date:"2025", duration:"58:38", genre:"Dubstep", cover:"https://i1.sndcdn.com/artworks-SNO0muXMjgpsmoae-NN46KQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-138-baklaxa", notes:"Tash Todd aka Bakläxa (@bklxa) is a DJ and producer based in Berlin, they play a mix of dubstep, left-field, percussion-driven dance music making noise at @noodsradio as well as working as a digital arts workshop mentor across Berlin.\n\nThey released a wonderful solo EP called 'Swordfish' on @eckerecords as well as other singles with paloma records. She is half of Neutralised, a Cybernetic DJ Duo from tash todd & pbl.fyi.\n\nBakläxa's 'Learning Curves' show on @thfradio aims to explore projects that are operating in and around the city of Berlin. Get ready to listen to 1h hour of dubstep bangers, perfect to smooth you through the week..." },
    { id:"mix-137", title:"TOMBOLOMIXX 137", artist:"Mui Mui", date:"2025", duration:"59:37", genre:"2 Step", cover:"https://i1.sndcdn.com/artworks-zalywXFMrQm0bgV3-xN56hg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-137-mui-mui", notes:"Introducing Brooklyn based DJ, organizer, and dancer, Mui Mui (meaning \"little sister\" in Cantonese). A dynamic selector with an instinct for pushing sonic boundaries- as a DJ, nothing is ever quite off limits for her.\n\nAs a restless organizer/curator, and resident of Hong Kong Community Radio, Mui Mui takes shape in her many creative expressions. Through her years as a classically trained dancer, Mui Mui brings a unique understanding of rhythm and movement to her sets, captivating dance floors and radio waves with her sensitivity towards what moves ones body. One thing is for sure- Mui Mui will always welcome you into her sanctuary of dance.\n\nIn this absolute bomb of a mix, she delivers one hour of 2step, breaks, dubstep and spiral techno that will take you on a beautiful ride. Enjoy*****\n@mui_muii" },
    { id:"mix-136", title:"TOMBOLOMIXX 136", artist:"Energy Spin", date:"2025", duration:"1:12:42", genre:"House", cover:"https://i1.sndcdn.com/artworks-gHmTbLG5VUqEJ2c0-YNzlzw-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-136-energy-spin", notes:"Energy Spin is a producer, DJ and music explorer through his funktastik youtube channel. His mission is to dig and digitalize records that do not have any digital exposure or are impossible to find on the internet. He is a strong advocate of niche music and alternative distribution instead of conventional streaming channles like Spotify. \n\nAdditionally, he likes to think of himself as a detractor of the usual secrecy of deejays and enjoys sharing any information he might have about any cut or release that might pique the listener's interest.\n\nHere he presents over an hour of ncie deep house vibes thatI am sure will get you over the week!!\n\n@energyspinners" },
    { id:"mix-135", title:"TOMBOLOMIXX 135", artist:"FAFF", date:"2025", duration:"1:01:55", genre:"House", cover:"https://i1.sndcdn.com/artworks-S8dRco7yD2VCyx4u-MCVXzg-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx135-faff", notes:"Woohoooooo! \n\nIntroducing dynamic london based duo FAFF (@faffldn) to the series. Elliott and Orny are one of the most exciting acts to have burst onto the scene within the last few years. Residents of Big Dyke Energy (ldn) they have a unique and exciting style that spans across club music genres, which has earned them top spots playing at iconic clubs and festivals like Field Manuevers, UNFOLD, Fabric or Draaimolen. \n\nFAFF’s production talent is also incredible, with their most recent releases on Unit 6 & Fabric Records. Dreamlike synths and unique samples that create a genre-bending sound, that can be truly said to be their own.\n\nPrepare yourself for a full tornado of energetic house rythms, acid baselines, cheeky vocals and hypnotic melodies.\n\n@bigdykeenergy" },
    { id:"mix-134", title:"TOMBOLOMIXX 134", artist:"Cerame Super Sound", date:"2025", duration:"2:17:28", genre:"", cover:"https://i1.sndcdn.com/artworks-p9dqJWjNFWjiyEdn-oZyeEw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/ceramesupersound", notes:"Cerame Super Sound!!\n\nIf you don't know this name you might get to know it soon, as Guillermo is an absolute freak of nature behind the turntables. Resident of the well established parties LINEAR in Madrid, he has a very smooth well earned style when it comes to play throwing deep house tunes, breaks, and techno with a sprinkle of 90's melodies. Started in 2010 he is an avid record collector that lived 6 years in Amsterdam working as a sound engineer for clubs and festivals.\n\nHe brings over two hours of fantastic tunes, blended together in a cosmic trip that will get you prepared for the weekend!\n\nEnjoy***\n\n@ceramesupersound" },
    { id:"mix-133", title:"TOMBOLOMIXX 133", artist:"Gala (Live at Margarita Electronica)", date:"2025", duration:"2:16:10", genre:"Dub Techno", cover:"https://i1.sndcdn.com/artworks-VFN6pjK8CkJfzRzc-AUMuQA-t500x500.png", scUrl:"https://soundcloud.com/tombololive/tombolomixx-133-gala", notes:"woohooooo!\n\nSo stoked to be introducing wizard Gala to the series!!***\n\nHalf of Madrid-based duo SYSTEMA, Gala builds her sets around a multigenre journey of sounds that make you loose yourself on the dancefloor. From tech house to progressive, with glimpses of techno and electro, she is a woman on a mission to deliver the grooviest sounds. Pure dance material, made by and for the club.\n\nThis dynamic blend has taken her to booths all over Spain, leaving her mark on iconic venues like Razzmatazz, Studio 76, Siroco, The Bassement, Caracol, Apolo… you name it.\n\nIn this mix she delivers over 2h15 of the most elegant house at the iconic madrid party Margarita Electronica. So gooooood!!!\n\n@gala-sambola-999521240 @we_systema @margaritaelectronica" },
    { id:"mix-132", title:"TOMBOLOMIXX 132", artist:"Mrtnz (Live at Jaleo Real 2024)", date:"2025", duration:"1:16:33", genre:"House", cover:"https://i1.sndcdn.com/artworks-x8wjzSKQJwq7xtiy-WfOy2Q-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-132-mrtnz", notes:"Ricardo aka @Mrtnzzz, started collecting music and spinning records when he was 15. Since then, he’s been deeply involved in the spanish electronic music scene, contributing to various collectives and projects in Andalucía and Madrid. Nowadays he’s based in Berlin, where he hosts a monthly show on the community radio station RBL, focusing on ambient and downtempo sounds.\n\nWhen it comes to the dancefloor, Ricardo has a bias towards house and trance-inspired records, always with groove as the centerpiece.\n\nThis mix is an excerpt from his set at Jaleo Real, played from 4 PM to 6 PM on Saturday. It was an evening full of good vibes, friends, smiles, Bloody Marys, and plenty of wind to challenge the needles. \n\nHouse from the tops! Elegant melodies! Smooth Vibes!!!!\ntune in" },
    { id:"mix-131", title:"TOMBOLOMIXX 131", artist:"xandru", date:"2025", duration:"1:23:05", genre:"", cover:"https://i1.sndcdn.com/artworks-xRnQ7bw4zaP4n8c7-SN0QAg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-131-xandru", notes:"Yay!\n\nHappy to be welcoming to the series this fantastic music enthusiast currently based in Madrid. xandru's sets always aim to spread a wide variety of sounds, from ambient and downtempo to strictly club oriented house, techno, electro, bass music and everything in between, always depending on the vibe.\n\nTracklist\n\n\"It’s been a while since I didn’t record a solo mix -except for the Breakfast Club Radioshows- so it took me a bit to think about the concept and the tracks I’ve wanted to include in it. You can expect some of my favourite records lately; new and old findings, some classics… \n@alda6\n\nLevon Vincent - For Mona, My Beloved Cat. Rest In Peace. [Novel Sound]\nMan Myth Magic - Different Places (Wombient Dormient) [Chroma]\nSteve Bug - Nighttrain [Raw Elements]\nSFV Acid - 125BPM At Night: 1 [Third Try Records]\nGlas Rm - Fully Dipped [Well Street Records]\nElectronic Résistance - Souvenir [Jericho]\nTechnical Onslaught - The Calling [Rawax]\nThe Silver Locusts - A Barren Garden [Penalty]\nPsychonauts - World Keeps Turning (Mogg & Naudascher Remix) [Souvenir]\nTammo Hesselink - Rather Stationary [Nous’klaer Audio]\nEbende - Magic Land [ARKAJO]\nBedrock - Forge (Fretwell Mix) [Bedrock Breaks]\nТИСК - Legit Check (Komponente & Kurilo Par Acid Mix) [ТИСК]\nDobbs, Christian J - The Alchemist (Christian J Remix) [Redgrave Records]\nFix - Face [Rawax]\nSantos - Work The Box (Vocals) [Trax Records]\nSubb-an - Synchronicity [Phonica AM]\nADNY - Dreaming (Hulkkonen Remix) [Turbo]\nRound Two - New Day (Club Vocal Mix) [Main Street Records]" },
    { id:"mix-130", title:"TOMBOLOMIXX 130", artist:"Recho (Live at Jaleo Real 2024)", date:"2024", duration:"2:01:11", genre:"Ambient", cover:"https://i1.sndcdn.com/artworks-uE25SQlaygJCpFTH-oSVPOQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-130-recho-live-at-jaleo-real", notes:"So happy to welcome Mr. Videogame Man himself, Carlos aka Recho, @recho_1, Rechaurio, Rerebo, Rechonauta or whatever he wants to the series, 2nd degree Shaman of MEL gang collective (@m-e-l-gang). A man full of music genres, strong basses, lysergic atmospheres,  rhythms as broken as your first phone, never tired until he gets tired, absolute fist-heavy. This set was recorded at Jaleo Real, first sounds of the morning, after a well-deserved break, ambient, downtempo, dubs and some dub and a little bit of a hang." },
    { id:"mix-129", title:"TOMBOLOMIXX 129", artist:"DJ Bruce Lee", date:"2024", duration:"1:29:36", genre:"Techno", cover:"https://i1.sndcdn.com/artworks-1cN9hpPp2gM0awPs-RR6SlQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-129-dj-bruce-lee-1", notes:"Welcoming to our series, a Barcelona legend and one of the coolest dj names in the game right now: DJ Bruce Lee! He's the mastermind behind the End Of Dayz label and the absolute boss of the Rhythm Control Barcelona record store.\n\n1H30 of techno, recorded in Human Razzmatazz in October 2024. Heavy hitters, sweet transitions :) \n\nEnjoy!\n@dj-bruce-lee / @end-of-dayz-1" },
    { id:"mix-128", title:"TOMBOLOMIXX 128", artist:"Nogue (Live at Jaleo Real 2024)", date:"2024", duration:"1:36:58", genre:"Dub", cover:"https://i1.sndcdn.com/artworks-AwyVwNHUH13sygvV-lOONrQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-128-nogue", notes:"Introducing @nogguee a woman 100% about music. Whether she's writing it, booking it, DJing or simply dancing to it, she always brings the best vibes to the table.\n\nAlba Nogue is pure joy on the dancefloor. Ambient, trance, house, prog, latin music... she always combines all kind of genres in the best way. She is responsible for Jaleo Real aka the Spanish Grammys, where she recorded this masterpiece. Over 1h30 of pure dub gems that took the crowd into a cosmic trip." },
    { id:"mix-127", title:"TOMBOLOMIXX 127", artist:"Pépe", date:"2024", duration:"57:20", genre:"Electronic", cover:"https://i1.sndcdn.com/artworks-1cM78bBsPUAT4SyM-P51EKQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-127-pepe", notes:"Prepare for a sonic journey as we introduce one of valencia's hidden gems and submerge ourselves into the captivating world of Pépe (@ae_pepe). An amazing producer and dj that has established himself through putting a lot of work, and played all around Europe.\n\nAn hour long mix, full of electronic mercurial sounds, bpms up and down, hiphop, dubstep, ragga and much more.\n\nTune in!" },
    { id:"mix-126", title:"TOMBOLOMIXX 126", artist:"Nicolas Mirón", date:"2024", duration:"1:02:57", genre:"", cover:"https://i1.sndcdn.com/artworks-FkSWF1sS2zjvhyrx-34GN4g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-126-nicolas-miron", notes:"Introducing raising star Nicolás Mirón. DJ and producer based in Madrid, he is a goofy head, one of the coolest people I’ve met recently, besides to have a bonkers selection when shuffeling records. \n\nHe is a resident radio host at Radio Relativa, with a programme that you should not miss called \"Pa' Riparla Benne\", and a member of Echo Alpha Recordings, his label party." },
    { id:"mix-125", title:"TOMBOLOMIXX 125", artist:"TRS", date:"2024", duration:"1:23:08", genre:"Dub", cover:"https://i1.sndcdn.com/artworks-tzLd9yFYpz8NvbWz-H11qZA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-125-trs", notes:"aYO!!\n\nSo stoked to introduce Teresa aka TRS (@balancedtrs) str8 from Valencia. One of the coolest persons we've met this year so far. She is the promoter of \"2 girls 1 deck\" (best name for a party ever), an event that aims to connect female artists within the Spanish community, which has already taken place in different places of Spain such as Madrid, Barcelona and Valencia.\n\nThis mix is a live performance of when she played in Razzmatazz for the iconic Human Party to open for icon DJ Marcelle. 1 hour and 23 minutes of nice slow dubby tunes, ragga stuff and breaky sounds. A rare and beautiful mixture of sounds that will get you through the week. \n\nDon't miss***" },
    { id:"mix-124", title:"TOMBOLOMIXX 124", artist:"Ken", date:"2024", duration:"1:02:53", genre:"Deep House", cover:"https://i1.sndcdn.com/artworks-IFd4kvzPSoEoNfj1-MZuU7A-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-124-ken", notes:"Introducing emerging talent @Amarsaikhan-Temuujin aka Ken from the heart of Ulaantbataar, Mongolia. Curator of projects such as Laut (@lauttt), Ken is a key figure to understand what the underground mongolian scene is about. He been djing since 2019 getting inspired by deep house and minimal genres.\n\nHere he presents a beautiful variety of gems that will take you on a nice afternoon ride. enjoy!" },
    { id:"mix-123", title:"TOMBOLOMIXX 123", artist:"Villella", date:"2024", duration:"2:06:56", genre:"", cover:"https://i1.sndcdn.com/artworks-n08WcoHIzywyPvw1-F6enVw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/villella", notes:"Yeeeehheeeew!!\n\nTOMBOLOMIXX has the enormous pleasure to welcome  @RiccardoVillella, boss of the classic and admired @truants series. Vilella has an incredible knowledge of all strands of the rave pool, shown here with this masterful and euphoric journey through house, prog, breaks, trance,everything your soul desires.\n\nVillella creates the types of mixes that you will consistently return to over and over, he has the true gift of being able to choose a world and a feeling and realise it entirely." },
    { id:"mix-122", title:"TOMBOLOMIXX 122", artist:"Tom Allman", date:"2024", duration:"1:00:47", genre:"Breaks", cover:"https://i1.sndcdn.com/artworks-eWaeUathOE9Dkmyl-pCLmXA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-124-tom-allman", notes:"Yay!\n\nHappy to introduce @mantissa1 co-founder @thomasallman-1 contributing to our series with a truly stellar mix.\n\nMantissa is an online platform, mix series, occasional party and label which does an amazing job in curating music and collaborates with tons of great artists around the globe.\n\nGliding through a range of bouncy and spacial melodies, this mix is an hour full of bouncy and wiggly broken beats over acid baselines that will get you to the end of the week!!!\n\nEnjoy!" },
    { id:"mix-121", title:"TOMBOLOMIXX 121", artist:"Telephones (Live at Tombolo Club)", date:"2024", duration:"2:03:50", genre:"", cover:"https://i1.sndcdn.com/artworks-ZXmpygqGZaEu0zwr-7u8ISg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-121-telephones-live-at-tombolo-club-1", notes:"Woohoooo! \n\nOver 2h of magic dust by monsieur fantastic himself, the one and only @Telephones! Live at Tombolo Club on the 14/12/2023.\n\nTrue Jamón lover, father to the greatest dog, this Norwegian born, Berlin based DJ & producer Henning Severud is renowned for his limitless dancefloor energy spreading. A spirited curveball-mix ranging from balearic tutti-frutti, proto-house and percussion-workouts to cosmic techno, discokraut-gymnastics, downtempo & outerworldly explorations!\n\nEnjoy!" },
    { id:"mix-120", title:"TOMBOLOMIXX 120", artist:"BanzaiXX", date:"2024", duration:"1:27:49", genre:"Cosmic", cover:"https://i1.sndcdn.com/artworks-SS9r9NAktsmNjM8v-dmHAig-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/banzaixx-mix-5324", notes:"Introducing my good friend @BanzaiXX straight from the mountains of Switzerland. A great producer, better dj, even better rider. He is 1/2 of @aquarium-sunrise and you can usually catch him goofying around in the best clubs of Zurich.\n\nPresenting an hour and a half of pure cosmic trip, acib baselines and house beats that blend into trancey melodies. Just as good as batch of schrooms on a saturday morning.\n\nEnjoy!" },
    { id:"mix-118", title:"TOMBOLOMIXX 118", artist:"TTRRAACCAA", date:"2024", duration:"55:59", genre:"", cover:"https://i1.sndcdn.com/artworks-IqVoYylqOcVTh89S-9ucEgA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-116-ttrraaccaa", notes:"Ayoooo!\n\nTime for andalusian producer, singer and DJ @TTRRAACCAA! Based in Barcelona he is the co-founder of the party collective Necro Records and with two albums behind him, he is best known for his Soundcloud Edits, where he uses pop vocals and transforms them into a more clubber version.\n\n\nWhen it comes to composing his sets, he challenges himself to get rid of prejudices and mix a lot of genres, conceiving them as an exciting journey through different decades, styles, spaces and textures, fusing old school classics with the newest SoundCloud." },
    { id:"mix-117", title:"TOMBOLOMIXX 117", artist:"Surrealita", date:"2024", duration:"1:03:20", genre:"Breaks", cover:"https://i1.sndcdn.com/artworks-1fgvhHI2zYlHTsrN-0J1ilg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolo-surrealita", notes:"Woohoo!\n\nHappy to introduce @Surrealita to the mix family. She is a DJ currently based in Olomouc, Czech republic, co-founder of Dekadance collective - a chosen family tha brings together dance music enthusiasts. Surrealita's genre-eclectic selection is usually defined by a higher bpm rate where dreamy synths meet broken beats and heavy bass with a touch of dancefloor euphoria. Currently, she’s a music programmer for AFO festival and a resident of Infame radio platform. \n\n\nTRACKLIST:\nEqui - Enlightenment\nD.R.F - PILL I\nKeo Lab - Sound Of Waves\nJVNZ - Midnight\nSimulakrum - Hey DJ (unreleased)\nSister Zo - Pump\nKobayashi Maru - Chambers\nNior - Spectral Blade\ndomizako - Off Key\nBluetoof - Lost between A & N\nLocal Group - Water Dub\nCiel - Hide\nAXT - Hunty\nCOUNT - STICK N POKE\nParadox - Breakbeater\nStones Taro - Energy" },
    { id:"mix-116", title:"TOMBOLOMIXX 116", artist:"Dichas", date:"2024", duration:"57:04", genre:"Downtempo", cover:"https://i1.sndcdn.com/artworks-LjqhslCKF8EizME1-PrVsew-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolaso-dichas-definitif", notes:"Yo yo yo!!\n\nSuper happy to welcome our good friend Dichas (@dichoso88) to the series! \n\nPassionate about both electronic and not electronic music, he is a Dj and promoter based in Madrid who likes to move between different tempos of the leftfield side of dance music. Coming from the underground Madrid’s scene with his dear skating collective Sevenmad, he has developed a sophisticated approach that granted him a place into the clubbing scene and the music fashion world.\n\n The mix is about an hour of slow jams that serves both your sunny mornings or the first couple drinks of a long sweaty night." },
    { id:"mix-115", title:"TOMBOLOMIXX 115", artist:"Gisele South", date:"2024", duration:"58:01", genre:"Breaks", cover:"https://i1.sndcdn.com/artworks-4RLVkjrLAwUVsZGs-qzO28w-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolo-gisele-south", notes:"@GiseleSouth is an Argentine DJ currently based in Madrid. Passionate about music since a very young age, she felt a strong connection with the club culture where she found in djing a way to share her energy!\n\nHer eclectic sets capture different moods through the use of atmospheric vocals and frenetic, funky beats using genres such as UKG, Bass, Ghetto Tech and broken beats with acid touches.\n\nStay tuned!" },
    { id:"mix-114", title:"TOMBOLOMIXX 114", artist:"Duetempi", date:"2023", duration:"1:02:51", genre:"", cover:"https://i1.sndcdn.com/artworks-cRnbz5Wox4SnMsYo-ypC70g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/italectro-2", notes:"Time for a fresh recording from Giulio aka @duetempi, the king of Venice. \n\nHe is a designer and DJ, passionate about electronic and non-electronic music, that after debuting with the Trash Dance collective (2019) and the experience at Biennale College Musica (2020-2021), co-founded @FlexyHauss: a web radio and independent space for industry professionals. In 2022, he began his residency at Argo16 (Marghera - VE), where he offers a selection free from the concept of genre, seamlessly traversing the musical space-time. \n\nHis sets move between the energetic and the dreamlike, passing through the hypnotic and the obscure, absorbing the essence of his surroundings.\n\nThis mix is sick!! Full of acid, synth wave sounds perfect to get you through the weekend. Enjoy" },
    { id:"mix-113", title:"TOMBOLOMIXX 113", artist:"Daniel Kelsan (Live at Mordisco Club)", date:"2024", duration:"1:30:48", genre:"", cover:"https://i1.sndcdn.com/artworks-DXOCuD6h7kD48ZYS-DpcoJg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/daniel-kelsan", notes:"Woohooo!\n\nIntroducing Madrid-born Daniel Kelsan, a DJ and radio host that has always been passionate about music. Working his way into different industry positions, he currently holds a key role at Granada’s scene as a resident DJ in venues like Planta Baja or Industrial Copera.\n\nHe hosts a weekly show for Radio Relativa, in Madrid called @Individualactivities, a dynamic snapshot of the ever-changing electronic music scene, a vibrant showcase of eclectic sounds featuring guest DJs and artists who collectively paint a vivid picture of the entire electronic music scene.\n\nThis set was recorded in Mordisco Club opening for legend Luca Lozano, and is full of energetic bangers that will get you through ya week straight to the weekend.\nEnjoy!" },
    { id:"mix-112", title:"TOMBOLOMIXX 112", artist:"Niki Lauda", date:"2024", duration:"1:04:45", genre:"Breaks", cover:"https://i1.sndcdn.com/artworks-Nilmf2GzThSyUCyz-GlYxyQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-112-niki-lauda", notes:"Yay!! \n\nSo happy to welcome @NikiLauda1312, an artist that started in the Granada scene by DJing and organizing events since 2018 and now based in Madrid. She has played in emblematic festivals like Sónar, Primavera Sound, BBK Live, ElRow or Cala Mijas. Also do not miss her sets at Boiler Room, Keep Hush or HÖR. \n\nJust over an hour of some of her favorite deconstructed club & broken beat tunes for your enjoyment. Enjoy!" },
    { id:"mix-111", title:"TOMBOLOMIXX 111", artist:"Gray", date:"2023", duration:"1:04:17", genre:"90's House", cover:"https://i1.sndcdn.com/artworks-6jDrSOlFRoqcq11H-CMPB4g-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-111-gray", notes:"Starting the year in style with this OG, Clubber, record collector and DJ named Gray (@grahamed). As he says \"Music is a passion not a business\".\n\nLover of most forms of electronic and club music, Gray has a big obsession in 90s house and trance but also likes soul, funk, disco and synth/new wave. A music related experience walking encyclopedia that has spent lots of time in clubs especially in the 90s at numerous venues across the UK and Ibiza. \n\n Deejaying for fun and the love of music, you can find him sometimes behind the decks, giving you a nostalgic approach of the vibe you could feel at those sweaty clubs most of us were too young to experience. Enjoy!" },
    { id:"mix-110", title:"TOMBOLOMIXX 110", artist:"CRKS290", date:"2023", duration:"50:35", genre:"Dubstep", cover:"https://i1.sndcdn.com/artworks-UdZ9wOdMT27OFAMk-owWHdQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-110-cuco", notes:"@CRKS290 is an active dj and promoter operating mainly from Madrid. He is 1/3 of iconic collective @dembooty a really cool collective that specialize in UKG, Dubstep, D&B, Jungle amongst many other interesting genres. Here he delivers 50 minutes of pure dubstep gems, good to start the week in a fresh and wonky way. Enjoy!" },
    { id:"mix-109", title:"TOMBOLOMIXX 109", artist:"Sifon", date:"2023", duration:"1:35:45", genre:"", cover:"https://i1.sndcdn.com/artworks-hN07UMbkEeyRnKXk-yeZZIA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/sifon-mix-2023", notes:"Having worked close to a decade behind-the-scenes in the music industry has given SIFON (@sifon_greg) a strong deep sense of the connective tissue electronic music can provide for communities around the world. \n\nOriginally from Barcelona, SIFON, real name Greg Menendez, spent a number of years in Berlin and London attuning their ears and lending their heart to the European music industry before relocating to Naarm/Melbourne end of 2022." },
    { id:"mix-108", title:"TOMBOLOMIXX 108", artist:"Maria Latina", date:"2023", duration:"1:21:02", genre:"Detroit", cover:"https://i1.sndcdn.com/artworks-2Mt2MYDZC4KT7mra-ZJDNpg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-108-maria-latina", notes:"Woooohoooo!\n\nHappy to welcome @Maria_Latina for the number 108 of our mix series. This colombian artist based in Madrid is a true talent when it comes to dive in dusty record boxes in the most hidden recordshops everywhere she goes and find beautiful jems. She loves to explore different styles, jumping between different decades and tempos. From cumbia, italo, disco or house, through her selection she transmits tons of energy to the dance floor.\n\nFor this occasion she decided to curate 1h20 of a very unique detroit house selection. Tune in :<*" },
    { id:"mix-107", title:"TOMBOLOMIXX 107", artist:"Josephine' Soundscapes", date:"2023", duration:"1:42:09", genre:"Downtempo", cover:"https://i1.sndcdn.com/artworks-qiqAgqtShVLDT3h4-BNX1cg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/machines-desirantes-mastering-24bit", notes:"Woohoo :))\n\nHappy to welcome Josephine' Soundscapes aka @machines-desirantes to our mix series! Jose Salas is an audiovisual creator and active cultural promoter in Madrid. As a DJ, or selector, he always works with a mixture of research from the past with a strong commitment to the present. He is currently part of the collectives a_mal_gam_a and CALMA, both working in the Spanish underground electronic scene. He also hosts a radio show called \"Campos de Marte\" on @radio-relativa, focused on experimentation in music.\n\nThis mix is a beautiful mixture of downtempo beats, acid synths and trippy melodies that builds up beautifully over 1h40. It's as he calls it, a \"Machine Desirante\" coming to life :)" },
    { id:"mix-106", title:"TOMBOLOMIXX 106", artist:"Fredfades", date:"2023", duration:"1:26:36", genre:"House", cover:"https://i1.sndcdn.com/artworks-yr9oQxyL2hVLSyYW-1BvX1Q-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/fredfades-tombolo-mix-fixed", notes:"@Fredfades, absolute leGend. This super house head and mad selector from Oslo burns our mix series with this magic 1h30 set full of house gems. Massive 90's energy, club anthems, strong pianos, cheeky baselines over sexy vocals. Such gooood stuffff!***  Catch him this saturday in our party in Siroco!! Tickets in our IG profile. Do not miss.\n\nLet's go!" },
    { id:"mix-105", title:"TOMBOLOMIXX 105", artist:"Gudlyfe", date:"2023", duration:"1:02:52", genre:"Downtempo", cover:"https://i1.sndcdn.com/artworks-GorivZ6LDQscVsuG-bKrOlQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/elio-fumagalli", notes:"Absolute G! Happy to introduce my good friend @Elio-Fumagalli aka Gudlyfe, a half swiss half italian bigfoot that comes down from the mountains to deliver 1h of pure downtempo sassy beats, perfect to get you pumped on the beginning of the week. You can catch him next saturday 23.09 in our \"rentrée\" party. Don't miss!!!" },
    { id:"mix-104", title:"TOMBOLOMIXX 104", artist:"Gerhard", date:"2023", duration:"1:30:41", genre:"", cover:"https://i1.sndcdn.com/artworks-zdIy6Pu9rOszOj4V-12EvqQ-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-105-gerhard", notes:"straight from mexico @esenciamx boss @gerhardmusic <3\n\nGerhard is a DJ, record collector and electronic music fan from Mexico. He is also the creator of the blog Esencia, which is responsible for the sound diffusion of different musical genres, from the origins of dance and ambient music to the most recent sounds in the industry." },
    { id:"mix-103", title:"TOMBOLOMIXX 103", artist:"Nokto", date:"2023", duration:"58:56", genre:"Progressive", cover:"https://i1.sndcdn.com/artworks-gbTurmCKew496Yxj-2VshQg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-098-nokto", notes:"Yayyyy Danil Ryazanov aka Nokto is a producer and DJ currently based in Brno, Czech Republic. His musical journey all started with an obsession of trip-hop and downtempo, which in turn led him to Bristol - the cradle of UK underground scene. It was there that he started developing his own style: from hardcore and jungle, to garage, breakbeat and UK-bass music.\n\nextreme mix. @noktomezo" },
    { id:"mix-102", title:"TOMBOLOMIXX 102", artist:"Clap Kent", date:"2023", duration:"55:52", genre:"House", cover:"https://i1.sndcdn.com/artworks-AkTarcKMHMxlG4m4-QzlhIg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-102-clap-kent", notes:"Music has always been an essential part of Jacobo García López de Araujo aka @Clap-Kent. After a decade agitating Madrid’s nightlife with projects focused on culture and community such us Self-Care or The Bourbaki, he moves to Barcelona in 2021. Record colector and DJ, his selections are deep and careful, taking forgotten gems and presenting them with a close perspective, slightly looking to the left of the horizon.\n\nThis mix is perfect to get you started for the weekend. House jams, over cheeky melodies that will make you stand up and shake that booty." },
    { id:"mix-101", title:"TOMBOLOMIXX 101", artist:"Khvedeliani B2B DJ Sendnudes", date:"2023", duration:"1:58:30", genre:"House", cover:"https://i1.sndcdn.com/artworks-HJB36Oh6yM2DUnEq-YN7ytg-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/khvedeliani-b2b-dj-sendnudes-2104", notes:"Introducing to the series two rising stars from the heart of one of my true favorite cities in the world, Tbilisi. Khvedeliani and DJ Sendnudes (part of the iconic @Vodkast12 crew) are constantly in the pursue of good music. Here's a 2h mix recorded in a beautiful night at Lovebar, an open air club located in Tbilisi. Mellow world music, samba, disco that end up in gorgeous house jams.... delighful. \n\nEnjoy :)\n\n@khvedelianisandro @djsendnudess" },
    { id:"mix-100", title:"TOMBOLOMIXX 100", artist:"Poly Chain", date:"2023", duration:"58:28", genre:"Electro", cover:"https://i1.sndcdn.com/artworks-iJCAVsaqV7bwhjzP-lezkUA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-100-poly-chain", notes:"TOMBOLOMIXX number 100!!\n\n@Poly-Chain is the project of Sasha Zakrevska, a composer, dj, curator and graphic designer currently based in Berlin. She released music in our label later last year, a beautiful electro track with glimpses of darkness amongst other artists. This mix is just a preview of what she is gonna do in our party on july's next friday.\n\nSo stoked to have her on the series!!!" },
    { id:"mix-99", title:"TOMBOLOMIXX 99", artist:"customer service", date:"2023", duration:"55:51", genre:"", cover:"https://i1.sndcdn.com/artworks-aW90G2pC3d9uSxmV-ynvavw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-099-customer-service", notes:"So happy to share this sick mix from Maddie aka Customer Service!! Maddie is a supreme dj and promoter from Baltimore.\n\n@maddogservice" },
    { id:"mix-98", title:"TOMBOLOMIXX 98", artist:"Ruin Klarity \"A mix to feel close to you\"", date:"2023", duration:"1:10:32", genre:"", cover:"https://i1.sndcdn.com/artworks-vCVhb2b2dDURfyVN-fMNuLw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-098-ruin-klarity", notes:"Iconic Emma is Ruined, also known as Ruin Klarity (@ruinxxx) is a writer, visual/performance artist and bodyworker. \n\n “A mix to feel close to you originally made for someone I miss every day. So, get ready for a moody, romantic, dreamy rock ride. Moving through different genres of rock and roll, my language of feeling closeness.\"" },
    { id:"mix-97", title:"TOMBOLOMIXX 97", artist:"Bardia Mehrzadeh", date:"2023", duration:"1:04:15", genre:"", cover:"https://i1.sndcdn.com/artworks-X3l8VLUamKVpHAYj-0WN1uw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-097-bardia-mehrzadeh", notes:"@Bardia-Mehrzadeh is a very talented young DJ from Teheran, Iran. He is team member of Iranian radio station called @Beshknow and has one of the most unique sounds we have gathered in some time. You can listen some of his brilliant stuff on different radio stations such as Mutant Radio, Noods Radio and more." },
    { id:"mix-96", title:"TOMBOLOMIXX 96", artist:"Goasis", date:"2023", duration:"1:09:52", genre:"PSY", cover:"https://i1.sndcdn.com/artworks-houSHbsVIJImNgcV-enYYEw-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-096-goasis", notes:"Grant's extensive collection and knowledge of Goa Trance and masterful set curation have earned him recognition across the pond not to mention a dedicated cult following in Naarm. Coming for the first time to Spain to play for Tombolo. Looking forward." },
    { id:"mix-95", title:"TOMBOLOMIXX 95", artist:"Baldman", date:"2023", duration:"1:12:29", genre:"Dub", cover:"https://i1.sndcdn.com/artworks-ubeRcFXG8ZAylUPj-yTVyUA-t500x500.jpg", scUrl:"https://soundcloud.com/tombololive/tombolomixx-095-baldman", notes:"Iconic, your favorite dj's favorite dj. We've been waiting for this one for a long time. Madrid's very owwn super hero, dj and maximo active promoter Baldman (@baldmankid) has put together a serie of magnificent dub jams. Light a spliff, get comfortable on ya sofa and let yourself dream over these melodies.." },
